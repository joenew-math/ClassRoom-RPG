<style>
  :root{

    --ink:#e8ecf7; --dim:#9aa5c4;

    --legend:#ff9c40;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;min-height:100vh;overflow-x:hidden}
  .num{font-family:"Consolas","Courier New",monospace}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10;flex-wrap:wrap}

header .sp{flex:1}
@media(max-width:760px){header .tag{display:none}}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;font-size:13px}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:7px 14px;transition:background .15s}
  .btn:hover{background:#343f63}
  .btn.gold{background:var(--gold);color:#2a2004;font-weight:bold;border-color:var(--gold)}
  .btn.gold:hover{background:#ffc94d}
  .btn.danger{color:#ffb3b3;border-color:#7a3a3a}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  main{max-width:1180px;margin:0 auto;padding:14px}

  /* 首頁 */
  .home{display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 12px;text-align:center}
  .home-classroom{min-height:calc(100vh - 96px);padding:46px 18px 58px;border:4px solid #141414;border-radius:16px;overflow:hidden;

  .home-classroom .crest{width:86px;height:74px;display:flex;align-items:center;justify-content:center;margin-bottom:-13px;

  .home-classroom h2{margin:0;padding:9px 22px;background:linear-gradient(135deg,#6f263c,#9e3c4c);color:#fff5cf;border:4px solid #141414;
    border-radius:9px;box-shadow:5px 5px 0 rgba(20,20,20,.78);text-shadow:2px 2px 0 #321b2b}

  .home-classroom .role-card:hover{transform:translateY(-4px);border-color:#f1b82d;box-shadow:3px 7px 0 rgba(20,20,20,.75)}
  .home-classroom>.mini:last-child{max-width:640px;padding:10px 14px;background:rgba(25,22,30,.87);color:#d7d1c4!important;border:2px solid rgba(255,242,196,.6);border-radius:9px}
  body.home-menu-mode{height:100vh;height:100dvh;overflow:hidden}body.home-menu-mode main#app{height:calc(100vh - 55px);height:calc(100dvh - 55px);max-width:1240px;padding:7px 10px;overflow:hidden}
  .home-classroom.home-menu-shell{height:100%;min-height:0;padding:9px 14px 12px;gap:6px}.home-menu-shell .crest{width:58px;height:48px;font-size:35px;margin-bottom:-8px}.home-menu-shell h2{padding:5px 17px;font-size:19px}.home-menu-bar{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;width:100%;margin:3px 0}.home-menu-bar .btn{min-width:120px;padding:7px 12px;border:3px solid #141414;box-shadow:3px 3px 0 rgba(20,20,20,.68);font-weight:900}.home-pane-viewport{position:relative;flex:1;min-height:0;width:100%;overflow:hidden}.home-pane-scale{position:absolute;left:50%;top:0;width:min(1120px,100%);transform-origin:top center}.home-login-pane{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%}.home-login-pane>p{margin:0!important;padding:5px 12px;color:#2d261f;background:rgba(255,247,220,.94);border:3px solid #141414;border-radius:8px;box-shadow:3px 3px 0 rgba(20,20,20,.72);font-weight:800}.home-login-pane .role-card{padding:8px 6px}.home-login-pane .role-card .face{font-size:30px}.home-login-pane .role-card .nm{font-size:14px}.home-login-pane .role-card .sub{font-size:10px}.home-footer-credit{max-width:640px;padding:7px 12px;background:rgba(25,22,30,.87);color:#d7d1c4;border:2px solid rgba(255,242,196,.6);border-radius:9px;font-size:10px;line-height:1.45}.home-progress-pane{width:100%}.home-progress-pane .class-progress{margin:4px auto 10px}.home-progress-road{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.home-progress-step{padding:8px 5px;border:3px solid #141414;border-radius:10px;background:#fff;color:#141414;box-shadow:2px 2px 0 rgba(20,20,20,.48);font-size:11px;font-weight:900}.home-progress-step.open{background:#e8ffe1}.home-progress-step.current{outline:3px solid #f0b429}.home-progress-step .ico{display:block;font-size:22px}.home-honor-pane>div{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start!important;gap:10px;width:100%}.home-honor-pane>div>div{width:100%!important;max-width:none!important;margin-top:0!important;padding:9px!important}.home-honor-pane .peak-honor-head,.home-honor-pane .castle-honor-head{grid-template-columns:1fr}.home-honor-pane .peak-copy,.home-honor-pane .castle-copy{text-align:center}.home-honor-pane .peak-scene{max-width:330px}.home-honor-pane .castle-scene{transform:scale(.88);transform-origin:top center;margin:0 auto -22px}.home-guide-pane .home-guide{position:relative;left:auto;top:auto;width:100%;max-width:900px;margin:auto}.home-guide-pane .home-guide-body{max-height:none;overflow:visible}.home-guide-pane .guide-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* 首頁下拉選單：固定寬度、等分欄位並浮在內容上方，避免長短文字擠歪版面。 */
  .home-menu-bar.feature-launcher{position:relative;z-index:32;width:min(760px,100%);margin:4px auto 6px;display:flex;flex-direction:column;align-items:center;gap:0;overflow:visible;border:0;box-shadow:none}
  .home-menu-bar .board-launcher-main{width:min(320px,100%);min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px 16px;line-height:1.2;white-space:nowrap}
  .home-menu-bar .board-launcher-panel{position:absolute;left:50%;right:auto;top:calc(100% + 7px);transform:translateX(-50%);z-index:45;width:min(680px,calc(100vw - 34px));margin:0;padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:stretch;max-height:none;overflow:visible;background:rgba(255,247,220,.98);border:3px solid #141414;border-radius:12px;box-shadow:6px 7px 0 rgba(20,20,20,.72)}
  .home-menu-bar .board-launcher-panel .btn{width:100%;min-width:0;min-height:46px;margin:0;padding:8px 10px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;white-space:nowrap;background:#fff;color:#141414;border-width:3px;box-shadow:2px 3px 0 rgba(20,20,20,.58)}
  .home-menu-bar .board-launcher-panel .btn:hover{background:#fff0ad;border-color:#d99d0b;transform:translateY(-2px)}
  #studentQuickLogin{padding:10px;border:2px solid #3fae76;border-radius:10px;background:#effff5;text-align:center}
  #studentQuickLogin .student-quick-account{line-height:1.45;overflow-wrap:anywhere}
  #studentQuickLogin .student-quick-hint{margin-top:5px;line-height:1.4}
  @media(max-width:760px){.home-menu-bar .btn{min-width:0;flex:1;padding:6px 4px;font-size:11px}.home-progress-road{grid-template-columns:repeat(3,minmax(0,1fr))}.home-honor-pane>div{grid-template-columns:1fr 1fr}.home-guide-pane .guide-steps{grid-template-columns:1fr}.home-menu-shell .crest{display:none}.home-menu-shell h2{font-size:16px}.home-classroom.home-menu-shell{padding-top:7px}}
  @media(max-width:430px){.home-menu-bar .board-launcher-main{width:100%;min-height:40px}.home-menu-bar .board-launcher-panel{width:calc(100vw - 24px);grid-template-columns:1fr;gap:6px;padding:8px}.home-menu-bar .board-launcher-panel .btn{min-height:40px;font-size:12px}#studentQuickLogin{padding:7px}#studentQuickLogin .student-quick-account,#studentQuickLogin .student-quick-hint{font-size:10px}#studentQuickContinue{margin-top:5px!important;padding:8px 10px}}
  #loginFlowLoading [data-login-step]{display:block;padding:5px 3px;background:#ddd;color:#666;border:2px solid #999;border-radius:7px;font-size:10px;font-weight:900}#loginFlowLoading [data-login-step].on{background:#f0b429;color:#141414;border-color:#141414}
  @media(max-width:620px){.home-classroom{padding:58px 10px 42px;background-position:center top;border-width:3px}.home-classroom h2{font-size:20px;padding:8px 14px}.home-classroom .crest{width:70px;height:62px;font-size:42px}}
  .home .crest{font-size:52px}
  .home h2{color:var(--parch);letter-spacing:4px;font-size:24px}
  .home p{color:var(--dim);font-size:13px;max-width:460px;line-height:1.7}
  .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:100%;max-width:640px}
  /* 首頁左上新手目錄：收合時不擋登入，展開後像遊戲任務手冊 */
  .home-guide{position:absolute;left:0;top:0;z-index:24;width:min(430px,calc(100% - 128px));text-align:left;
    background:#fff8df;border:4px solid #141414;border-radius:12px;box-shadow:5px 5px 0 rgba(20,20,20,.82);overflow:hidden}
  .home-guide summary{cursor:pointer;list-style:none;padding:12px 15px;font-size:16px;font-weight:900;
    background:linear-gradient(135deg,#f6bd2f,#ffd86b);color:#141414;user-select:none}
  .home-guide summary::-webkit-details-marker{display:none}
  .home-guide summary::after{content:"＋ 展開";float:right;font-size:12px}
  .home-guide[open] summary::after{content:"－ 收合"}
  .home-guide-body{padding:12px;max-height:min(72vh,610px);overflow:auto}
  .home-guide-index{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
  .home-guide-index span{display:flex;align-items:center;justify-content:center;gap:3px;min-height:34px;padding:4px;
    background:#fff;border:2px solid #141414;border-radius:7px;font-size:12px;font-weight:900;text-align:center}
  .home-guide-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .home-guide-card{background:#fff;border:2px solid #141414;border-radius:8px;padding:9px;line-height:1.55;color:#34302a}
  .home-guide-card b{display:block;color:#141414;font-size:13px;margin-bottom:2px}
  .home-guide-card .mini{font-size:11px}
  .guide-steps{display:grid;gap:7px}.guide-step{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;
    background:#fff;border:2px solid #141414;border-radius:9px;padding:8px;color:#30291f}
  .guide-step-icon{width:32px;height:32px;display:grid;place-items:center;border:2px solid #141414;border-radius:8px;
    background:#ffd86b;font-size:18px;font-weight:900}.guide-example{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .guide-example span{padding:3px 7px;border:1px dashed #9b6b12;border-radius:5px;background:#fff8df;font-size:11px;font-family:monospace}
  .student-join-box{display:none;width:100%;max-width:520px;margin:10px auto 0;padding:12px;background:#fff8df;
    border:3px solid #141414;border-radius:12px;box-shadow:4px 4px 0 rgba(20,20,20,.75);text-align:left}
  .student-join-grid{display:grid;grid-template-columns:1.15fr 1fr .72fr;gap:7px;margin:8px 0}
  .student-join-grid label{font-size:11px;font-weight:900;color:#57462a}.student-join-grid input{width:100%;margin-top:3px}
  @media(max-width:720px){.home-guide{position:relative;left:auto;top:auto;width:100%;max-width:640px;order:-1;margin-bottom:10px}.home-guide-index{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:520px){.home-guide-index{grid-template-columns:1fr}.home-guide-cards{grid-template-columns:1fr}.student-join-grid{grid-template-columns:1fr 1fr}.student-join-grid label:first-child{grid-column:1/-1}}
  .enroll-base-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:5px}
  @media(max-width:520px){.enroll-base-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @keyframes registrationSpin{to{transform:rotate(360deg)}}
  .job-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;max-width:900px;margin:0 auto}
  .job-card{background:#fff;border:3px solid #141414;border-radius:12px;padding:12px 10px;color:#141414;cursor:pointer;text-align:center;box-shadow:4px 4px 0 rgba(20,20,20,.75);transition:transform .12s}
  .job-card:hover{transform:translateY(-4px)}
  .job-card:active{transform:translateY(0)}
  .job-card.on{outline:5px solid var(--gold);outline-offset:2px;background:#fff8d8;transform:translateY(-3px)}
  .role-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 8px;color:var(--ink);display:flex;flex-direction:column;gap:5px;align-items:center;transition:transform .12s,border-color .12s}
  .role-card:hover{transform:translateY(-2px);border-color:var(--gold)}
  .role-card .nm{font-size:14px}
  .role-card .sub{font-size:11px;color:var(--dim)}
  .role-card.teacher{grid-column:1/-1;background:linear-gradient(135deg,#2c2a1c,#212940);border-color:var(--gold-dim);padding:16px}
  .role-card.teacher .face{font-size:34px}
  /* 教師選班頁：使用獨立的大型卡片，避免沿用首頁小角色卡後名稱與按鈕互相擠壓。 */
  .teacher-class-picker{width:100%;max-width:1080px;margin:0 auto;padding:0 6px 24px}
  .teacher-class-picker-head{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px auto 18px}
  .teacher-class-picker-head .crest{margin:0;font-size:48px;line-height:1}
  .teacher-class-picker-head h2{margin:0;text-align:left}
  .teacher-class-picker-head .mini{margin-top:4px;text-align:left}
  .teacher-class-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;width:100%;align-items:stretch}
  .teacher-class-card{min-width:0;min-height:190px;display:grid;grid-template-rows:1fr auto;background:#fff8df;border:4px solid #141414;border-radius:14px;box-shadow:6px 7px 0 rgba(20,20,20,.72);overflow:hidden}
  .teacher-class-enter{width:100%;min-height:130px;padding:20px 18px 14px;border:0;background:linear-gradient(145deg,#fffdf6,#fff0b9);color:#141414;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr);gap:15px;align-items:center;text-align:left}
  .teacher-class-enter:hover{background:linear-gradient(145deg,#fff8d7,#ffd86b)}
  .teacher-class-enter:focus-visible{outline:5px solid #2d73d5;outline-offset:-7px}
  .teacher-class-enter:disabled{cursor:wait;opacity:.7}
  .teacher-class-icon{width:62px;height:62px;display:grid;place-items:center;font-size:38px;background:#f0b429;border:3px solid #141414;border-radius:12px;box-shadow:3px 3px 0 rgba(20,20,20,.65)}
  .teacher-class-copy{min-width:0;display:flex;flex-direction:column;gap:7px}
  .teacher-class-name{display:block;font-size:24px;line-height:1.25;font-weight:950;overflow-wrap:anywhere}
  .teacher-class-code{display:inline-flex;align-items:center;align-self:flex-start;padding:4px 9px;background:#141414;color:#ffd45a;border-radius:6px;font-size:15px;letter-spacing:1.5px;font-weight:900}
  .teacher-class-hint{font-size:13px;color:#5a5a5a;font-weight:800}
  .teacher-class-actions{display:grid;grid-template-columns:1fr auto;gap:9px;padding:10px 12px 13px;background:#fff;border-top:3px solid #141414}
  .teacher-class-actions .btn{width:100%;min-height:44px;margin:0;padding:8px 12px!important;font-size:14px!important;display:flex;align-items:center;justify-content:center}
  .teacher-class-actions .teacher-class-delete{width:auto;min-width:88px}
  .teacher-new-class{max-width:760px!important;margin:24px auto 0!important;text-align:left}
  .teacher-new-class .inline-form{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;align-items:stretch}
  .teacher-new-class input{min-height:50px;font-size:17px}
  .teacher-new-class #ncCreate{min-height:50px}
  @media(max-width:700px){
    .teacher-class-picker{padding-inline:2px}.teacher-class-picker-head{justify-content:flex-start;padding:0 4px}.teacher-class-picker-head .crest{font-size:40px}
    .teacher-class-grid{grid-template-columns:1fr;gap:15px}.teacher-class-card{min-height:174px}.teacher-class-enter{min-height:118px;padding:16px 14px;grid-template-columns:56px minmax(0,1fr)}
    .teacher-class-icon{width:54px;height:54px;font-size:32px}.teacher-class-name{font-size:21px}.teacher-class-actions{grid-template-columns:minmax(0,1fr) auto}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .panel h3{font-size:14px;color:var(--parch);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h3::before{content:"◆";color:var(--gold);font-size:10px}
  .panel h3 .hsp{flex:1}

  /* 班級目標 */
  .goal-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .goal-bar{flex:1;min-width:180px;background:#141927;border-radius:10px;height:22px;overflow:hidden;border:1px solid #10141f;position:relative}
  .goal-bar>i{display:block;height:100%;background:linear-gradient(90deg,#4f8fe0,#7db2ff);transition:width .5s}
  .goal-bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;text-shadow:0 1px 2px #000}
  .goal-done .goal-bar>i{background:linear-gradient(90deg,var(--gold),#ffd970)}
  .boss-bar>i{background:linear-gradient(90deg,#7a2424,#e05252)}

  /* 觸控大屏:分組牆 */
  .board-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .group-wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

  /* 大屏專注模式：先只顯示入口，老師需要管理時才展開完整功能。 */
  .board-launcher{position:sticky;top:51px;z-index:9;background:rgba(22,27,40,.96);padding:7px 8px;border-bottom:1px solid var(--line)}.board-launcher-main{padding:8px 16px;font-size:14px}.board-launcher-panel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding:9px;background:#1b2136;border:1px solid var(--gold-dim);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.3)}.board-launcher-panel .tab{padding:6px 9px;font-size:12px}.board-focus{grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;padding-bottom:72px}.board-focus .group-card{padding:12px;min-height:250px}.board-focus .member-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}.board-focus .member{padding:10px 4px 8px;min-height:126px;justify-content:center;border-width:2px}.board-focus .member:hover{border-color:var(--gold);transform:translateY(-3px)}.board-focus .member-hp,.board-focus .gscore{display:none}.board-focus .member .mname{font-size:13px}.board-quickbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;justify-content:center;gap:7px;max-width:calc(100vw - 24px);padding:8px 10px;background:rgba(25,31,50,.94);border:1px solid var(--gold-dim);border-radius:13px;box-shadow:0 5px 20px rgba(0,0,0,.45);backdrop-filter:blur(8px);flex-wrap:wrap}.board-quickbar .mini{color:#dbe5ff}.board-quickbar .btn{padding:6px 10px;font-size:12px}@media(max-width:560px){.board-focus{grid-template-columns:1fr}.board-focus .member-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.board-focus .member{min-height:105px}.board-quickbar{bottom:6px;gap:4px}.board-quickbar .mini{display:none}}
  .feature-launcher{border:1px solid var(--gold-dim);border-radius:12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.25)}

/* ── 傷害數字(依目標最大生命比例分級；白→黃→紅，維持半透明) ── */
.dmg-pop{ --dmg-alpha:.82; position:fixed; z-index:135; pointer-events:none; font-weight:900; font-family:Consolas,monospace;
  transform:translate(-50%,-100%); -webkit-text-stroke:2px rgba(20,20,20,.88); paint-order:stroke;

.dmg-l{ --dmg-alpha:.86; font-size:52px; color:rgba(255,79,58,.94); animation:dmgBig .95s ease-out forwards; -webkit-text-stroke:3px rgba(20,20,20,.9); }

.dmg-crit{ --dmg-alpha:.9; isolation:isolate; min-width:1.8em; padding:.03em .16em .08em;
  font-size:58px; line-height:1; text-align:center; color:rgba(255,58,48,.96);
  -webkit-text-stroke:3px rgba(20,20,20,.94); text-shadow:3px 3px 0 rgba(0,0,0,.38);
  animation:dmgCrit 1.05s cubic-bezier(.18,.9,.24,1.15) forwards; }

  background:rgba(255,222,68,.38); clip-path:polygon(50% 0,59% 21%,77% 7%,79% 30%,100% 27%,85% 48%,100% 61%,78% 66%,84% 91%,61% 78%,50% 100%,41% 78%,16% 92%,23% 66%,0 61%,16% 48%,0 28%,22% 30%,23% 7%,41% 21%);
  filter:drop-shadow(2px 0 rgba(20,20,20,.62)) drop-shadow(-2px 0 rgba(20,20,20,.62)) drop-shadow(0 2px rgba(20,20,20,.62)) drop-shadow(0 -2px rgba(20,20,20,.62)); }

play:flex;align-items:center;justify-content:space-between;gap:9px}.after-school-announcement{padding:9px;border:2px solid #d7b85a;border-radius:9px;background:#fff9df}.after-school-announcement>div{margin:4px 0;white-space:pre-wrap}.after-school-lock-note{padding:8px;border:2px dashed #b48b24;border-radius:8px;background:#fff8de;color:#6e5318}@media(max-width:760px){.after-school-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}.after-school-boundary,.after-school-progress{grid-template-columns:1fr 1fr}.after-school-section .dungeon-task-quick{align-items:stretch;flex-direction:column}}@media(max-width:420px){.after-school-shortcuts,.after-school-boundary,.after-school-progress{grid-template-columns:1fr}}
