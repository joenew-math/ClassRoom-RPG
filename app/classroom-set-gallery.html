<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>四職六件式套裝預覽</title><style>
body{margin:0;background:#eee5ce;color:#272327;font-family:system-ui,sans-serif}header{padding:20px;max-width:1360px;margin:auto}h1{font-size:26px}select,button{font:inherit;padding:8px;margin-right:8px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:18px;max-width:1360px;margin:auto}.card{background:#fff8e7;border:2px solid #665834;border-radius:18px;text-align:center;padding:14px;min-width:0}.doll{height:345px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 70%,#dbd4bf,transparent 60%)}.doll svg{max-width:100%;height:320px}.pieces{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.pieces svg{width:42px;height:42px}.tiers{text-align:left;font-size:13px;line-height:1.7}.tiers div{padding:8px;border-bottom:1px solid #dfd0b0}.tiers .off{color:#888}iframe{display:none}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){main{grid-template-columns:1fr}.doll{height:310px}}
</style></head><body><header><h1>四職六件式傳說套裝</h1><p>每件 50 鑽石・六件 300 鑽石・BOSS 掉落／公會商店</p><label>素體 <select id="base"><option>male2</option><option>male1</option><option>male3</option><option>male0</option><option>female1</option><option>female2</option><option>female3</option><option>female0</option></select></label><label>穿戴 <select id="count"><option value="6">6 件</option><option value="4">4 件</option><option value="2">2 件</option><option value="0">素體</option></select></label><p id="status">讀取正式紙娃娃渲染器…</p></header><main id="gallery"></main><iframe id="runtime" src="班級RPG-公會大廳v126.html"></iframe><script>
const frame=document.getElementById('runtime');
function draw(){try{const base=document.getElementById('base').value,count=Number(document.getElementById('count').value);const cards=frame.contentWindow.eval('PIXEL_SETS.map(set=>{const s=newStudent("PREVIEW_"+set.job,set.name,set.job,"A");s.baseVariant='+JSON.stringify(base)+';s.gender='+JSON.stringify(base.startsWith('female')?'female':'male')+';s.registrationComplete=true;s.jobPending=false;PIXEL_SET_ITEMS.filter(it=>it.pixelSet===set.id).slice(0,'+count+').forEach(it=>s[it.type+"Id"]=it.id);return {name:set.name,html:dollSVG(s,255),icons:PIXEL_SET_ITEMS.filter(it=>it.pixelSet===set.id).map(it=>pixelSetSprite(it,42)).join(""),tiers:set.tiers};})');document.getElementById('gallery').innerHTML=cards.map(c=>'<article class="card"><h2>'+c.name+'</h2><div class="doll">'+c.html+'</div><div class="pieces">'+c.icons+'</div><div class="tiers">'+c.tiers.map(([name,desc],i)=>'<div class="'+(count<(i+1)*2?'off':'')+'"><b>'+((i+1)*2)+' 件・'+name+'</b><br>'+desc+'</div>').join('')+'</div></article>').join('');document.getElementById('status').textContent='此頁僅預覽，不修改學生角色或背包。';}catch(e){document.getElementById('status').textContent='尚未就緒，請稍候再切換選單。';}}
frame.onload=draw;document.getElementById('base').onchange=draw;document.getElementById('count').onchange=draw;
</script></body></html>
