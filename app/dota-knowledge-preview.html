<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dota 知識攻塔・隔離測試</title><style>
*{box-sizing:border-box}body{margin:0;background:#171a27;color:#fff;font-family:system-ui,sans-serif}header{height:46px;display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px;overflow:auto;white-space:nowrap}button{font:inherit;background:#ffdf79;border:2px solid #342b19;border-radius:9px;padding:7px 10px;color:#211a0d;cursor:pointer}iframe{width:100%;height:calc(100dvh - 170px);border:0;display:block}.controls{position:fixed;bottom:12px;left:12px;display:grid;grid-template-columns:repeat(3,50px);gap:4px;z-index:20;padding:7px;background:#111a;border-radius:12px}.controls button{touch-action:none;user-select:none;height:45px}.actions{position:fixed;right:12px;bottom:12px;display:flex;gap:5px;z-index:20}.actions button{width:90px;position:relative;overflow:hidden}.actions small{display:block;font-size:12px;margin:4px 0}.actions button:disabled{cursor:default;background:#8f876e;color:#fff}.cd-track{display:block;height:7px;background:#242938;border-radius:8px;overflow:hidden}.cd-fill{display:block;height:100%;width:100%;background:#65e4b3;transition:width .1s linear}.hint{padding:25px}#message{font-size:12px;color:#ffee9c}
</style></head><body><header><b>Dota 本機隔離測試</b><button id="restart">重新開始</button><button id="near">移到答案塔附近</button><button id="pick">換題庫</button><span id="message">讀取中…</span></header><div id="host"></div><div class="controls"><i></i><button data-move="up">▲</button><i></i><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><div class="actions"><button data-act="attack"><span>⚔ 普攻</span><small class="cd-status">就緒</small><span class="cd-track" role="progressbar" aria-label="普攻冷卻進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="cd-fill"></i></span></button><button data-act="jobskill"><span>✨ 技能</span><small class="cd-status">就緒</small><span class="cd-track" role="progressbar" aria-label="技能冷卻進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="cd-fill"></i></span></button></div><script src="./dota-knowledge-preview.js"></script></body></html>
