<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F9;--surface:#fff;--ink:#16233B;--ink-soft:#5B6B84;--pos:#1F6FEB;
 --pos-soft:#E4EEFD;--neg:#E23D45;--zero:#F0A81E;--zero-soft:#FCEFD3;--line:#C7D4E5;
 --shadow:0 1px 2px rgba(22,35,59,.05),0 8px 24px rgba(22,35,59,.07);
 --mono:"Space Grotesk",ui-monospace,monospace;
 --han:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
 font-family:var(--han);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.credit{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.top{position:sticky;top:0;z-index:30;background:rgba(238,243,249,.95);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700}
.count{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--pos);
 background:var(--pos-soft);border:1px solid var(--pos);border-radius:9px;padding:5px 12px}
.btn{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
 border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
 padding:8px 14px;border-radius:9px}
.btn:hover{border-color:var(--pos);color:var(--pos)}
.btn.main{background:var(--pos);border-color:var(--pos);color:#fff}
.btn.main:hover{opacity:.88;color:#fff}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 8px}
.tab{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
 border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
 padding:7px 16px;border-radius:10px}
.tab.on{border-color:var(--pos);background:var(--pos-soft);color:var(--pos)}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:15px;
 box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.chap-h{display:flex;align-items:center;gap:10px;padding:13px 18px;
 background:#F7FAFE;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chap-h .g{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#fff;
 background:var(--ink);padding:3px 9px;border-radius:6px}
.chap-h h2{font-size:16px;margin:0;font-weight:700}
.chap-h .n{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.unit{padding:6px 0}
.unit-h{font-size:13px;font-weight:700;color:var(--ink-soft);padding:8px 18px 4px}
.row{display:flex;align-items:flex-start;gap:12px;padding:9px 18px;
 border-top:1px solid #EEF2F7;cursor:pointer;transition:background .12s}
.row:hover{background:#F7FAFE}
.row.on{background:var(--zero-soft)}
.row input{width:19px;height:19px;margin-top:3px;accent-color:var(--pos);cursor:pointer;flex:none}
.row .t{font-size:14.5px;font-weight:600}
.row .d{font-size:12.5px;color:var(--ink-soft)}
.row .f{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
 background:#F1F5FA;border-radius:5px;padding:2px 8px;white-space:nowrap;align-self:center}
.note{background:var(--zero-soft);border:1px solid #EBC98C;border-radius:13px;
 padding:13px 16px;margin:16px 0;font-size:13.5px}
#out{width:100%;min-height:150px;font-family:var(--mono);font-size:12.5px;
 border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;
 background:var(--surface);color:var(--ink);resize:vertical;display:none}
footer{color:var(--ink-soft);font-size:12.5px;text-align:center;padding:26px 0 40px}
@media(max-width:640px){.row .f{display:none}}
</style><style id="manga-theme">
/* ===== 動漫畫框主題 Manga Panel Theme ===== */
:root{
  --mg-ink:#14161C;          /* 主線稿黑 */
  --mg-paper:#FBF7EE;        /* 漫畫紙色 */
  --mg-tone:#E4DED0;         /* 網點色 */
  --mg-shadow:6px 6px 0 var(--mg-ink);
  --mg-shadow-sm:4px 4px 0 var(--mg-ink);
}

/* 紙張 + 網點底 */
body{
  background-color:var(--mg-paper)!important;
  background-image:
    radial-gradient(var(--mg-tone) 1.6px, transparent 1.7px),
    radial-gradient(var(--mg-tone) 1.6px, transparent 1.7px);
  background-size:14px 14px;
  background-position:0 0, 7px 7px;
}

/* 頂部橫幅：黑底白字，像漫畫的標題條 */
.topbar,.top{
  background:var(--mg-ink)!important;
  border-bottom:4px solid var(--mg-ink)!important;
  backdrop-filter:none!important;
}
.topbar .brand,.top h1{color:#fff!important;letter-spacing:.04em;font-weight:800!important}
.topbar .brand b{color:#FFD166!important}
.topbar .brand i{color:#FF6B6B!important}
.topbar .crumb,.credit{color:#D8D4CA!important}

/* 大標題：描邊字 */
.hero h1{
  color:var(--mg-ink)!important;font-weight:900!important;letter-spacing:-.02em;
  text-shadow:4px 4px 0 rgba(0,0,0,.14);
}
.hero h1 em,.hero h1 .ch{color:#FF6B6B!important}
.eyebrow{
  display:inline-block;background:var(--mg-ink);color:#fff!important;
  padding:5px 14px;border-radius:0;font-weight:800!important;letter-spacing:.18em;
  transform:rotate(-1.2deg);
}
.hero p{color:#4A4638!important}

/* 集氣線：hero 後方放射線 */
.hero{position:relative;isolation:isolate}
.hero::before{
  content:'';position:absolute;inset:-10px -30px auto -30px;height:190px;z-index:0;
  background:repeating-conic-gradient(from 0deg at 50% 0%,
    rgba(20,22,28,.06) 0deg 2deg, transparent 2deg 8deg);
  pointer-events:none;
}
.hero>*{position:relative;z-index:1}

/* 單元標籤：像漫畫音效框 */
.unit-tag,.tag,.lvl-badge,.chap-h .g{
  background:var(--mg-ink)!important;color:#fff!important;
  border:3px solid var(--mg-ink)!important;border-radius:0!important;
  font-weight:800!important;transform:rotate(-1.5deg);box-shadow:3px 3px 0 rgba(0,0,0,.2);
}
.lvl-badge.b1{background:#2FA36B!important}
.lvl-badge.b2{background:#2F6FE8!important}
.lvl-badge.b3{background:#E8453C!important}
.unit-head h2,.sec-head h2,.chap-h h2{font-weight:900!important;color:var(--mg-ink)!important}

/* ── 畫框：所有卡片與面板 ── */
.card,.ch,.stage,.qcard,.lb-list,.keybox,.note,.hint,.chap,.stat,
.overall,.res-hero,.wrong-section,.canvas-card{
  background:#fff!important;
  border:3.5px solid var(--mg-ink)!important;
  border-radius:0!important;
  box-shadow:var(--mg-shadow)!important;
}
.card,.ch{transition:transform .12s ease, box-shadow .12s ease!important}
.card:hover,.ch:hover{
  transform:translate(-3px,-3px) rotate(-.6deg)!important;
  box-shadow:9px 9px 0 var(--mg-ink)!important;
}
.card h3,.ch h3{font-weight:900!important;color:var(--mg-ink)!important}
.card .desc,.ch .sub{color:#5A5648!important}
.card .go,.ch .go{
  font-weight:800!important;color:var(--mg-ink)!important;
  border-top:2.5px dashed var(--mg-ink);padding-top:7px;margin-top:4px;
}
.card .tno,.ch .no{color:#7A7466!important;font-weight:700!important}

/* 關卡卡片鎖定 */
.lvl-card.locked{filter:grayscale(.7)!important;opacity:.6!important}
.lvl-card.locked:hover{transform:none!important;box-shadow:var(--mg-shadow)!important}

/* ── 按鈕：厚框 + 硬陰影 + 按壓感 ── */
.btn,.qc,.opt,.q3c,.tab,.rank-tab,.fnbtn,.res-btn,.lobby-rank-btn,.go-btn,.next-btn,
.backbtn,.ang-btn,.hdr-btn{
  border:3px solid var(--mg-ink)!important;
  border-radius:0!important;
  background:#fff!important;
  color:var(--mg-ink)!important;
  font-weight:800!important;
  box-shadow:var(--mg-shadow-sm)!important;
  transition:transform .08s ease, box-shadow .08s ease, background .12s!important;
}
.btn:hover:not([disabled]),.qc:hover:not([disabled]),.opt:hover:not([disabled]),
.q3c:hover:not(:disabled),.tab:hover,.rank-tab:hover,.fnbtn:hover,.res-btn:hover,
.next-btn:hover,.backbtn:hover{
  background:#FFF3D6!important;
  transform:translate(-2px,-2px)!important;
  box-shadow:6px 6px 0 var(--mg-ink)!important;
}
.btn:active:not([disabled]),.qc:active,.opt:active,.q3c:active,.next-btn:active,
.tab:active,.res-btn:active,.backbtn:active{
  transform:translate(3px,3px)!important;
  box-shadow:0 0 0 var(--mg-ink)!important;
}
/* 主要行動按鈕：黃底黑框，最顯眼 */
.btn.primary,.next-btn,.go-btn,.res-btn.primary,.btn.main{
  background:#FFC93C!important;color:var(--mg-ink)!important;
}
.btn.primary:hover,.next-btn:hover,.go-btn:hover,.res-btn.primary:hover{
  background:#FFD666!important;color:var(--mg-ink)!important;
}
.tab.on,.rank-tab.on{background:#FFC93C!important;color:var(--mg-ink)!important}
.btn[disabled],.qc:disabled,.q3c:disabled{
  opacity:.45!important;box-shadow:2px 2px 0 var(--mg-ink)!important;
}

/* 答題對錯 */
.qc.ok,.opt.correct,.q3c.ok,.ang-btn.ok{
  background:#B9F6C8!important;border-color:var(--mg-ink)!important;color:#0F5B2E!important;
}
.qc.no,.opt.wrong,.q3c.no,.ang-btn.no{
  background:#FFC2BE!important;border-color:var(--mg-ink)!important;color:#8E1B14!important;
}

/* ── 對白框：動畫說明做成漫畫對話框 ── */
.caption{
  position:relative;background:#fff!important;
  border:3.5px solid var(--mg-ink)!important;border-radius:0!important;
  box-shadow:var(--mg-shadow-sm)!important;margin-top:26px!important;
}
.caption::before{
  content:'';position:absolute;top:-16px;left:44px;
  border-left:14px solid transparent;border-right:14px solid transparent;
  border-bottom:16px solid var(--mg-ink);
}
.caption::after{
  content:'';position:absolute;top:-10px;left:48px;
  border-left:10px solid transparent;border-right:10px solid transparent;
  border-bottom:11px solid #fff;
}
.caption .dot{display:none!important}
.caption p{font-weight:600!important;color:var(--mg-ink)!important}

/* 重點框：像旁白框 */
.keybox{background:#FFF3D6!important}
.keybox b{color:#C2410C!important}

/* 進度條 */
.prog,.ov-bar .track,.prog-track{
  border:2.5px solid var(--mg-ink)!important;border-radius:0!important;
  background:#fff!important;height:12px!important;overflow:hidden;
}
.prog i,.ov-bar .track i,.prog-fill{background:#FFC93C!important;border-radius:0!important}

/* 排行榜 */
.lb-row,.rank-row{border-top:3px solid var(--mg-ink)!important;border-radius:0!important}
.lb-row:first-child{border-top:none!important}
.lb-row.me,.rank-row.me{background:#FFF3D6!important}
.lb-row .rk,.rank-no{font-weight:900!important}

/* 表單 */
.namebox input,.name-input,#out{
  border:3px solid var(--mg-ink)!important;border-radius:0!important;
  background:#fff!important;font-weight:600!important;
}
.namebox input:focus,.name-input:focus{outline:3px solid #FFC93C!important;outline-offset:2px}

/* 檢核清單 */
.row{border-top:2px solid rgba(20,22,28,.15)!important}
.row.on{background:#FFF3D6!important}
.row input[type=checkbox]{
  width:22px!important;height:22px!important;accent-color:#E8453C!important;
  border:3px solid var(--mg-ink);border-radius:0;
}
.count{
  border:3px solid var(--mg-ink)!important;border-radius:0!important;
  background:#FFC93C!important;color:var(--mg-ink)!important;font-weight:800!important;
}
.unit-h{color:var(--mg-ink)!important;font-weight:800!important;
  border-left:6px solid var(--mg-ink);margin-left:12px;padding-left:10px!important}

/* 統計數字塊 */
.stat .n,.s-chip .sn,.r-chip .rn{font-weight:900!important;color:var(--mg-ink)!important}
.s-chip{border:3px solid var(--mg-ink)!important;border-radius:0!important;background:#fff!important}

/* 結果頁 */
.res-title{font-weight:900!important}
.res-emoji{filter:drop-shadow(3px 3px 0 rgba(0,0,0,.18))}

/* SVG 舞台外框 */
.stage svg{border:2.5px dashed rgba(20,22,28,.25);background:#fff}

footer{color:#6B6555!important;font-weight:600}

@media(max-width:640px){
  :root{--mg-shadow:4px 4px 0 var(--mg-ink);--mg-shadow-sm:3px 3px 0 var(--mg-ink)}
  .card,.ch,.stage,.qcard{border-width:3px!important}
}

</style>
<style id="uiscale-css">
/* ===== 顯示大小調整 + 手機版最佳化 ===== */
:root{--ui-z:1}

/* 內容區依使用者設定縮放（固定側欄與浮動面板另外處理） */
.view, #navlist{ zoom:var(--ui-z); }
@supports not (zoom:1){                 /* 不支援 zoom 時退回字級縮放 */
  .view{font-size:calc(15px * var(--ui-z))}
  #navlist{font-size:calc(13px * var(--ui-z))}
}

/* 尺寸鈕 */
#uiBtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:800;color:#fff;
  background:transparent;border:2.5px solid #fff;padding:6px 11px;margin-left:8px;
  transition:background .12s}
#uiBtn:hover{background:rgba(255,255,255,.16)}
#uiBtn .z{font-family:var(--mono);opacity:.85;font-size:11.5px}

/* ── 手機版 ── */
@media(max-width:640px){
  .wrap{padding:0 12px}
  .topbar .wrap,.top .wrap{height:auto;min-height:56px;padding-top:6px;padding-bottom:6px;
    flex-wrap:wrap;row-gap:6px}
  .topbar .brand{font-size:13px}
  .credit{font-size:10px;width:100%;order:3}
  .crumb{font-size:12px}
  #lbBtn{padding:6px 10px;font-size:12.5px}
  #uiBtn{padding:5px 9px;font-size:12px;margin-left:6px}

  .hero{padding:26px 0 12px}
  .hero h1{font-size:26px}
  .hero p{font-size:14px}

  /* 卡片單欄，點擊區更大 */
  .grid,.chapters{grid-template-columns:1fr!important;gap:11px}
  .card,.ch{min-height:0;padding:14px}
  .card .motif,.ch .motif{display:none}

  /* 動畫舞台：吃滿寬度、圖形放大 */
  .stage{padding:12px 10px}
  #topic .stage svg{max-height:46vh}
  .eq{font-size:20px}
  .caption{padding:12px 13px}
  .caption p{font-size:15px}

  /* 按鈕加大好按 */
  .btn,.qc,.opt,.q3c,.next-btn,.res-btn{min-height:46px;font-size:15px}
  .controls{flex-wrap:wrap;gap:8px}
  .controls .btn{flex:1 1 30%}
  .controls .steps{width:100%;text-align:center;margin-left:0}

  /* 評量選項 */
  .qtext{font-size:20px;margin:14px 0}
  .opt{padding:13px 14px}
}

/* 橫向手機：圖形高度再拉高 */
@media(max-height:520px) and (orientation:landscape){
  #topic .stage svg{max-height:62vh}
  .hero{padding:16px 0 8px}
}

/* 平板 */
@media(min-width:641px) and (max-width:960px){
  .grid,.chapters{grid-template-columns:repeat(2,1fr)}
  #topic .stage svg{max-height:42vh}
}

</style>

  let curChap=null,chapEl=null,curUnit=null;
  shown.forEach(r=>{
    const cid=r.grade+r.cn;
    if(cid!==curChap){
      curChap=cid;curUnit=null;
      chapEl=document.createElement('div');chapEl.className='chap';
      const n=ROWS.filter(x=>x.grade===r.grade&&x.cn===r.cn).length;
      chapEl.innerHTML=`<div class="chap-h"><span class="g">第 ${r.vol} 冊　${r.grade}${r.sem===1?'上':'下'}</span>
        <h2>第 ${r.cn} 章　${r.chap}</h2><span class="n">${n} 個主題</span></div>`;
      box.appendChild(chapEl);
    }
    if(r.unit!==curUnit){
      curUnit=r.unit;
      const u=document.createElement('div');u.className='unit-h';u.textContent='單元 '+r.unit;
      chapEl.appendChild(u);
    }
    const k=key(r);
    const row=document.createElement('label');
    row.className='row'+(checked.has(k)?' on':'');
    row.innerHTML=`<input type="checkbox" ${checked.has(k)?'checked':''}>
      <span><span class="t">${r.topic}</span><br><span class="d">${r.desc}</span></span>
      <span class="f">${r.frames} 步</span>`;
    row.querySelector('input').addEventListener('change',e=>{
      if(e.target.checked){checked.add(k);row.classList.add('on');}
      else{checked.delete(k);row.classList.remove('on');}
      updateCount();
    });
    chapEl.appendChild(row);
  });
}
function updateCount(){document.getElementById('cnt').textContent='已勾選 '+checked.size;}
['全部','七年級','八年級','九年級'].forEach(g=>{
  const b=document.createElement('button');
  b.className='tab'+(g==='全部'?' on':'');b.textContent=g;
  b.addEventListener('click',()=>{filter=g;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
    b.classList.add('on');render();});
  document.getElementById('tabs').appendChild(b);
});
render();
document.getElementById('gen').addEventListener('click',()=>{
  const out=document.getElementById('out');
  if(!checked.size){out.style.display='block';out.value='（尚未勾選任何主題）';return;}
  const lines=['要修改的主題：',''];
  let last='';
  ROWS.forEach(r=>{
    if(!checked.has(key(r)))return;
    const head=`第${r.vol}冊 ${r.grade}${r.sem===1?'上':'下'} 第${r.cn}章 ${r.chap}`;
    if(head!==last){lines.push(head);last=head;}
    lines.push(`  □ [${r.unit}] ${r.topic} ── 想修改：`);
  });
  out.style.display='block';out.value=lines.join('\n');out.focus();out.select();
});
document.getElementById('clr').addEventListener('click',()=>{
  checked.clear();updateCount();render();
  document.getElementById('out').style.display='none';
});
</script><script id="uiscale-js">
/* ===== 顯示大小切換 ===== */
(function(){
  const KEY=(window.__LB_KEY__||'app')+'_uiz';
  const STEPS=[{z:0.88,n:'小'},{z:1,n:'中'},{z:1.16,n:'大'},{z:1.34,n:'特大'}];
  let idx=1;

  const btn=document.createElement('button');
  btn.id='uiBtn';btn.type='button';
  btn.innerHTML='<span>Aa</span><span class="z"></span>';
  btn.title='調整顯示大小';

  const bar=document.querySelector('.topbar .wrap');
  if(bar){
    const lb=document.getElementById('lbBtn');
    if(lb) bar.insertBefore(btn,lb.nextSibling); else bar.appendChild(btn);
  }

  function apply(save){
    const s=STEPS[idx];
    document.documentElement.style.setProperty('--ui-z',s.z);
    btn.querySelector('.z').textContent=s.n;
    if(save){
      try{ if(window.storage) window.storage.set(KEY,String(idx),false); }catch(e){}
    }
  }
  btn.addEventListener('click',()=>{ idx=(idx+1)%STEPS.length; apply(true); });

  (async()=>{
    try{
      if(window.storage){
        const r=await window.storage.get(KEY,false);
        if(r){const v=parseInt(r.value,10); if(v>=0&&v<STEPS.length)idx=v;}
      }
    }catch(e){}
    apply(false);
  })();

  window.__uiScale={get:()=>STEPS[idx],set:i=>{idx=i;apply(true);}};
})();

</script>
