<style>
:root{--ink:#14161C;--paper:#FBF7EE;--soft:#5A5648;--line:#C7D4E5;

*{box-sizing:border-box}

 background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}

header{background:var(--ink);color:#fff;padding:16px;margin:-20px -16px 20px;

.paper h2{margin:0 0 6px;font-size:17px;font-weight:900}
.paper .meta{font-size:12.5px;color:var(--soft);line-height:1.7}

 padding:10px 14px;margin:-20px -16px 16px;display:none;align-items:center;gap:12px;flex-wrap:wrap}
#bar.on{display:flex}
#bar .t{font-family:var(--mono);font-size:15px;font-weight:900}
#bar .p{font-size:12.5px;opacity:.8}
#bar button{margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:800;
 cursor:pointer;background:#fff;color:var(--ink);border:2.5px solid #fff;padding:5px 12px}
.q{background:#fff;border:3.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
 padding:15px 17px;margin-bottom:13px}
.q .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.q .no{font-family:var(--mono);font-size:12px;font-weight:900;color:#fff;

.q .dim{font-size:11px;font-weight:800;color:#1F4E9C;background:#E4EEFD;
 border:2px solid #1F4E9C;padding:2px 7px}
.q .qt{font-size:16.5px;font-weight:700;line-height:1.75}
.q .ops{display:grid;gap:8px;margin-top:11px}
.q .op{padding:12px 14px;border:2.5px solid var(--ink);background:#fff;font-family:inherit;
 font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);
 text-align:left;display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.q .op .k{font-family:var(--mono);font-size:12px;color:var(--soft);flex:none;margin-top:2px}
.q .op:hover:not(:disabled){background:#FFF3D6}
.q .op.sel{background:#E4EEFD;border-width:3.5px}
.q .op.ok{background:#B9F6C8;color:#0F5B2E}
.q .op.no{background:#FFC2BE;color:#8E1B14}
.q .sol{display:none;margin-top:11px;padding:11px 13px;background:#FFF3D6;
 border:2.5px solid var(--ink);font-size:14.5px;line-height:1.65}
.q .sol.on{display:block}
.q .sol b{color:#C2410C}
#submit{width:100%;padding:16px;font-family:inherit;font-size:17px;font-weight:900;
 cursor:pointer;background:var(--green);color:#fff;border:3.5px solid var(--ink);
 box-shadow:6px 6px 0 var(--ink);margin-top:8px}
#submit:disabled{background:#9AA3B2;cursor:not-allowed}
#result{display:none}
#result.on{display:block}
.score{text-align:center;padding:22px 16px}
.score .n{font-family:var(--mono);font-size:52px;font-weight:900;line-height:1}
.score .n.hi{color:var(--green)}.score .n.mid{color:#C2410C}.score .n.lo{color:var(--red)}
.score .sub{font-size:14px;color:var(--soft);margin-top:8px}
.wk{margin-top:14px}
.wk h3{font-size:15px;margin:0 0 10px}
.wkrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13.5px}
.wkrow .nm{flex:1;font-weight:700}
.wkrow .bar{width:110px;height:15px;border:2px solid var(--ink);background:#fff;position:relative}
.wkrow .bar i{display:block;height:100%;background:var(--green)}
.wkrow .bar i.warn{background:var(--amber)}
.wkrow .bar i.bad{background:var(--red)}
.wkrow .sc{font-family:var(--mono);font-size:12px;font-weight:900;width:44px;text-align:right}
footer{text-align:center;font-size:12px;color:var(--soft);padding:22px 0}
@media(max-width:640px){.wrap{padding:16px 12px 50px}.q .qt{font-size:16px}}
</style></head><body>

<script>
const PAPERS = {"g7_sem1": {"title": "七年級上學期 學力檢測", "range": "第 1~4 章", "items": [{"q": "計算 (−6) + 15 − (−4) 的結果是多少？", "opts": ["5", "13", "−13", "25"], "ans": "13", "sol": "(−6)+15 = 9，9−(−4) = 9+4 = 13。減負變加正是關鍵。", "chs": ["第1章"]}, {"q": "下列各數中，絕對值最小的是哪一個？", "opts": ["−8", "−3", "5", "6"], "ans": "−3", "sol": "絕對值分別是 8、3、5、6，最小的是 3。絕對值看的是與 0 的距離。", "chs": ["第1章"]}, {"q": "計算 (−2)³ + (−3)² 的值是多少？", "opts": ["1", "−17", "17", "−1"], "ans": "1", "sol": "(−2)³ = −8（奇數次方保持負）、(−3)² = 9，−8+9 = 1。", "chs": ["第1章"]}, {"q": "某冷凍庫溫度為 −18°C，調高 25 度後又調低 12 度，最後溫度是幾度？", "opts": ["−5°C", "5°C", "−31°C", "31°C"], "ans": "−5°C", "sol": "(−18)+25 = 7，7−12 = −5。連續變化要依序計算。", "chs": ["第1章"]}, {"q": "84 的質因數分解是下列何者？", "opts": ["2²×3×7", "2×3²×7", "2²×21", "4×21"], "ans": "2²×3×7", "sol": "84 = 4×21 = 2²×3×7，必須拆到全部都是質數為止。", "chs": ["第2章"]}, {"q": "有 54 本書與 72 枝筆平分給若干人且都不剩，最多可分給幾人？", "opts": ["6 人", "9 人", "18 人", "27 人"], "ans": "18 人", "sol": "求 (54,72)。54=2×3³、72=2³×3²，共同取最小次方得 2×3² = 18。", "chs": ["第2章"]}, {"q": "甲燈每 12 秒、乙燈每 18 秒閃一次，同時閃過後最少幾秒再同時閃？", "opts": ["6 秒", "30 秒", "36 秒", "216 秒"], "ans": "36 秒", "sol": "求 [12,18]。12=2²×3、18=2×3²，取最大次方得 2²×3² = 36。", "chs": ["第2章"]}, {"q": "下列哪一組數互質？", "opts": ["9 與 15", "14 與 21", "16 與 25", "24 與 30"], "ans": "16 與 25", "sol": "16=2⁴、25=5² 沒有共同質因數，最大公因數為 1。其餘各組都有公因數 3 或 7。", "chs": ["第2章"]}, {"q": "計算 2/3 − 1/4 + 1/6 的結果是多少？", "opts": ["7/12", "5/12", "1/2", "3/4"], "ans": "7/12", "sol": "通分為 8/12 − 3/12 + 2/12 = 7/12。加減必須先通分。", "chs": ["第3章"]}, {"q": "一條繩子長 3 又 1/2 公尺，剪成每段 7/8 公尺，可剪成幾段？", "opts": ["3 段", "4 段", "5 段", "28 段"], "ans": "4 段", "sol": "7/2 ÷ 7/8 = 7/2 × 8/7 = 4。帶分數要先化成假分數，除以分數要乘倒數。", "chs": ["第3章"]}, {"q": "計算 (3/4 − 1/2) × 8 的值是多少？", "opts": ["2", "4", "6", "1/4"], "ans": "2", "sol": "括號內 1/4，1/4 × 8 = 2。先算括號再乘。", "chs": ["第3章"]}, {"q": "下列四個分數中，數值最大的是哪一個？", "opts": ["5/8", "2/3", "7/12", "3/5"], "ans": "2/3", "sol": "通分成 24 分母：15/24、16/24、14/24、14.4/24，最大為 2/3。", "chs": ["第3章"]}, {"q": "解方程式 5x − 8 = 2x + 7，x 的值是多少？", "opts": ["3", "5", "−5", "15"], "ans": "5", "sol": "移項得 3x = 15，x = 5。兩邊都有未知數時先集中到同一邊。", "chs": ["第4章"]}, {"q": "解方程式 2(x + 3) = 3x − 1，x 的值是多少？", "opts": ["5", "7", "−7", "1"], "ans": "7", "sol": "展開得 2x + 6 = 3x − 1，移項得 x = 7。有括號要先展開。", "chs": ["第4章"]}, {"q": "買 7 顆糖和一包 30 元的餅乾共 100 元，每顆糖多少元？", "opts": ["8 元", "10 元", "12 元", "14 元"], "ans": "10 元", "sol": "7x + 30 = 100 → 7x = 70 → x = 10。只有糖要乘 7。", "chs": ["第4章"]}, {"q": "哥哥比弟弟大 6 歲，兩人年齡和為 34 歲，弟弟今年幾歲？", "opts": ["12 歲", "14 歲", "16 歲", "20 歲"], "ans": "14 歲", "sol": "x + (x+6) = 34 → 2x = 28 → x = 14。哥哥則是 20 歲。", "chs": ["第4章"]}, {"q": "解方程式 x/3 − x/4 = 2，x 的值是多少？", "opts": ["6", "12", "24", "48"], "ans": "24", "sol": "兩邊同乘 12 去分母得 4x − 3x = 24 → x = 24。", "chs": ["第4章"]}, {"q": "若 a = −3、b = 2，則 |a| × b − a² 的值是多少？", "opts": ["−3", "3", "−15", "15"], "ans": "−3", "sol": "|−3| = 3，3×2 = 6；a² = 9；6 − 9 = −3。要先算絕對值與平方。", "chs": ["第1章"]}, {"q": "某數的 2/5 是 18，這個數是多少？", "opts": ["36", "45", "7.2", "90"], "ans": "45", "sol": "設該數為 x，(2/5)x = 18 → x = 18 × 5/2 = 45。", "chs": ["第3章", "第4章"]}, {"q": "一個長方形的長是寬的 3 倍，周長為 48 公分，寬是多少公分？", "opts": ["6 公分", "9 公分", "12 公分", "18 公分"], "ans": "6 公分", "sol": "設寬 x，2(x + 3x) = 48 → 8x = 48 → x = 6。長則是 18 公分。", "chs": ["第4章"]}]}, "g7_full": {"title": "七年級 全年學力檢測", "range": "第 1~9 章", "items": [{"q": "計算 (−4) × (−3) + (−10) ÷ 5 的結果是多少？", "opts": ["10", "14", "−14", "−10"], "ans": "10", "sol": "先乘除：(−4)×(−3) = 12、(−10)÷5 = −2，12 + (−2) = 10。", "chs": ["第1章"]}, {"q": "有 60 顆糖與 90 顆餅乾要平分且都不剩，最多可分給幾人？每人得幾顆糖？", "opts": ["30 人，2 顆", "15 人，4 顆", "30 人，3 顆", "10 人，6 顆"], "ans": "30 人，2 顆", "sol": "(60,90) = 30，60÷30 = 2。這是最大公因數的應用。", "chs": ["第2章"]}, {"q": "計算 1/2 + 2/3 × 3/4 的值是多少？", "opts": ["1", "7/8", "5/6", "9/8"], "ans": "1", "sol": "先乘：2/3 × 3/4 = 1/2，再 1/2 + 1/2 = 1。先乘除後加減。", "chs": ["第3章"]}, {"q": "解方程式 3(2x − 1) = 4x + 7，x 的值是多少？", "opts": ["2", "5", "−5", "1"], "ans": "5", "sol": "展開得 6x − 3 = 4x + 7，移項得 2x = 10，x = 5。", "chs": ["第4章"]}, {"q": "解聯立方程式 x + y = 12、x − y = 4，x 的值是多少？", const KEY = ['A','B','C','D'];
let cur = null, ans = {};

function home(){
  document.getElementById('bar').classList.remove('on');
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').classList.remove('on');
  document.getElementById('result').style.display = 'none';
  const h = document.getElementById('home');
  h.style.display = 'block';
  h.innerHTML = '<div class="card"><h2 style="margin:0 0 8px;font-size:16px">選擇一份試卷開始</h2>'
    + '<p style="margin:0;font-size:13px;color:var(--soft);line-height:1.7">'
    + '每份試卷可重複練習。作答完成後會顯示分數、各題詳解，以及依評量向度分類的弱點分析。</p></div>'
    + Object.keys(PAPERS).map(k=>{
      const p = PAPERS[k];
      const dims = [...new Set(p.items.flatMap(q=>q.chs||[]))].length;
      return '<div class="card paper" data-k="'+k+'"><h2>'+p.title+'</h2>'
        + '<div class="meta">共 '+p.items.length+' 題　·　涵蓋 '+dims+' 項評量向度<br>'
        + '範圍：'+p.range+'</div><span class="go">開始作答 →</span></div>';
    }).join('');
  h.querySelectorAll('.paper').forEach(c=>c.addEventListener('click',()=>start(c.dataset.k)));
}

function start(k){
  cur = k; ans = {};
  const p = PAPERS[k];
  document.getElementById('home').style.display = 'none';
  document.getElementById('result').classList.remove('on');
  document.getElementById('result').style.display = 'none';
  document.getElementById('bar').classList.add('on');
  document.getElementById('btitle').textContent = p.title;
  upd();
  const box = document.getElementById('quiz');
  box.style.display = 'block';
  box.innerHTML = p.items.map((q,i)=>
    '<div class="q" data-i="'+i+'"><div class="hd"><span class="no">第 '+(i+1)+' 題</span>'
    + (q.chs||[]).map(c=>'<span class="dim">'+c+'</span>').join('')
    + '</div><div class="qt">'+q.q+'</div><div class="ops">'
    + q.opts.map((o,j)=>'<button class="op" type="button" data-v="'+String(o).replace(/"/g,'&quot;')+'">'
      + '<span class="k">'+KEY[j]+'</span><span>'+o+'</span></button>').join('')
    + '</div><div class="sol"></div></div>').join('')
    + '<button id="submit" type="button" disabled>請先作答所有題目</button>';
  box.querySelectorAll('.q').forEach(qd=>{
    const i = +qd.dataset.i;
    qd.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>{
      if(document.getElementById('result').classList.contains('on')) return;
      qd.querySelectorAll('.op').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      ans[i] = b.dataset.v;
      upd();
    }));
  });
  document.getElementById('submit').addEventListener('click', grade);
  window.scrollTo(0,0);
}

function upd(){
  const p = PAPERS[cur], done = Object.keys(ans).length;
  document.getElementById('bprog').textContent = '已作答 ' + done + ' / ' + p.items.length;
  const b = document.getElementById('submit');
  if(b){
    b.disabled = done < p.items.length;
    b.textContent = done < p.items.length
      ? ('還有 ' + (p.items.length - done) + ' 題未作答')
      : '✓ 交卷看成績';
  }
}

function grade(){
  const p = PAPERS[cur];
  let right = 0;
  const byDim = {};
  p.items.forEach((q,i)=>{
    const qd = document.querySelector('.q[data-i="'+i+'"]');
    const ok = ans[i] === q.ans;
    if(ok) right++;
    (q.chs||['其他']).forEach(d=>{
      byDim[d] = byDim[d] || {r:0,t:0};
      byDim[d].t++; if(ok) byDim[d].r++;
    });
    qd.querySelectorAll('.op').forEach(x=>{
      x.disabled = true;
      if(x.dataset.v === q.ans) x.classList.add('ok');
      else if(x.dataset.v === ans[i]) x.classList.add('no');
    });
    const sol = qd.querySelector('.sol');
    sol.innerHTML = '<b>答案：</b>' + q.ans + '<br><b>解析：</b>' + q.sol;
    sol.classList.add('on');
  });
  const pct = Math.round(right / p.items.length * 100);
  const cls = pct >= 80 ? 'hi' : pct >= 60 ? 'mid' : 'lo';
  const rows = Object.keys(byDim).sort((a,b)=>
    (byDim[a].r/byDim[a].t) - (byDim[b].r/byDim[b].t)).map(d=>{
    const v = byDim[d], r = Math.round(v.r/v.t*100);
    const bc = r >= 80 ? '' : r >= 50 ? ' warn' : ' bad';
    return '<div class="wkrow"><span class="nm">'+d+'</span>'
      + '<span class="bar"><i class="'+bc.trim()+'" style="width:'+r+'%"></i></span>'
      + '<span class="sc">'+v.r+'/'+v.t+'</span></div>';
  }).join('');
  const weak = Object.keys(byDim).filter(d=>byDim[d].r/byDim[d].t < 0.6);
  const res = document.getElementById('result');
  res.style.display = 'block';
  res.classList.add('on');
  res.innerHTML = '<div class="score"><div class="n '+cls+'">'+pct+'</div>'
    + '<div class="sub">答對 '+right+' / '+p.items.length+' 題</div></div>'
    + '<div class="wk"><h3>各向度表現（由弱到強）</h3>'+rows
    + (weak.length ? '<p style="margin-top:12px;font-size:13.5px;line-height:1.7;color:var(--soft)">'
        + '<b style="color:var(--red)">建議加強：</b>' + weak.join('、')
        + '<br>可回平台對應章節重看動畫與練習題。</p>' : '')
    + '</div>';
  res.scrollIntoView({behavior:'smooth'});
}

document.getElementById('back').addEventListener('click', home);
home();
</script></body></html>
