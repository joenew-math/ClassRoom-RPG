    });
}

/* ═══════════════ 進階題型 2：步驟排序 ═══════════════
   解題步驟＝出牌序列。照順序點，順序錯就斷鏈。 */
function genStepPuzzle(){
  const a=2+rand(4), b=1+rand(6), x=2+rand(8), c=a*(x+b);
  return {
    title:`${a}(x + ${b}) = ${c}`,
    steps:[
      {t:`去括號：${a}x + ${a*b} = ${c}`},
      {t:`兩邊同減 ${a*b}：${a}x = ${c-a*b}`},
      {t:`兩邊同除以 ${a}：x = ${x}`},
      {t:`代回檢驗：${a}(${x}+${b}) = ${c} ✓`},
    ],
    traps:[
      {t:`兩邊同減 ${b}`,why:`括號還沒去，不能直接減 ${b} —— 括號裡的 ${b} 有被乘 ${a}。`},
      {t:`兩邊同除以 ${b}`,why:`x 沒有被乘 ${b}，除以 ${b} 沒有意義。`},
    ],
    ans:x};
}
function stepPuzzleAsk(cb,label){
  const P0=genDoorSteps();
  quizStats.total++;
  const cards=shuffle(P0.steps.map((s,i)=>({...s,idx:i}))
    .concat(P0.traps.map(t=>({...t,idx:-1}))));
  let need=0, chain=0, dead=false;
  const draw=(msg,msgCls)=>{
    overlay(`<div class="kicker">${label||'STEP CHAIN'} · 解題連擊</div>
      <h1 style="font-size:20px">${P0.title}</h1>
      <div class="rank">照正確順序點出每一步</div>
      <div class="stepbar">${P0.steps.map((s,i)=>
        `<span class="sdot${i<need?' done':''}">${i+1}</span>`).join('<span class="sarr">→</span>')}
        <span class="schain">${chain} 連</span></div>
      ${msg?`<div class="stepmsg ${msgCls||''}">${msg}</div>`:''}
      <div id="stepcards">${cards.map((c,i)=>
        `<div class="stepcard${c.used?' used':''}" data-i="${i}">${c.t}</div>`).join('')}</div>`,
      null,el=>{
        const row=el.closest('.stepcard'); if(!row||dead)return false;
        const c=cards[+row.dataset.i];
        if(c.used)return false;
        if(c.idx===need){                       // 接對了
          c.used=true; need++; chain++;
          if(need>=P0.steps.length){
            recordQuizCorrect({tag:'方程式解題步驟',tier:2});
            setTimeout(()=>overlay(`<div class="kicker">SOLVED</div>
              <h1 style="color:#8fe86a;text-shadow:0 3px 0 #14400a">解題連擊 ${chain} ！</h1>
              <div class="rank">x = ${P0.ans}</div>
              <div class="desc">你把整條解題流程<b>照順序</b>走完了。<br>
                注意這跟戰鬥的連擊是同一件事 —— <b>順序錯就不成立</b>。</div>
              <button class="go" id="ok">完成</button>`,()=>cb(true)),10);
            return true;
          }
          setTimeout(()=>draw('✓ 接上了！下一步','good'),10);
        }else{                                   // 斷鏈
          dead=true;
          const why=c.idx===-1?c.why:`順序不對 —— 這是第 ${c.idx+1} 步，現在該做第 ${need+1} 步。`;
          setTimeout(()=>overlay(`<div class="kicker">CHAIN BROKEN</div>
            <h1 style="color:#ff6a6a;text-shadow:0 3px 0 #4a0808">斷鏈了</h1>
            <div class="rank" style="color:#ff6a6a;border-color:#ff6a6a">${c.t}</div>
            <div class="desc">${why}</div>
            <button class="go" id="ok">再試一次</button>`,()=>stepPuzzleAsk(cb,label)),10);
        }
        return true;
      });
  };
  draw('');
}

/* ═══════════════ 進階題型 3：互動幾何 ═══════════════
   用操作代替選擇：親手把面積搬過去、把角撕下來拼成直線。 */
function geoPythagoras(cb){
  quizStats.total++;
  const T=[[3,4,5],[6,8,10]][rand(2)];
  const [a,b,c]=T;
  let moved=0;                    // 0=原狀 1=搬入a² 2=搬入b²
  const draw=()=>{
    overlay(`<div class="kicker">INTERACTIVE · 畢氏定理</div>
      <h1 style="font-size:19px">邊長上的正方形</h1>
      <div class="rank">直角三角形　${a} — ${b} — ${c}</div>
      <canvas id="geoc" width="320" height="300"></canvas>
      <div class="desc" style="text-align:center">
        ${moved===0?`三邊各長出一個正方形：<br>
          <b style="color:#8fd0ff">${a}² = ${a*a}</b>　
          <b style="color:#ff9a5a">${b}² = ${b*b}</b>　
          <b style="color:#ffe38a">${c}² = ${c*c}</b><br>
          兩個小的加起來，會剛好等於大的嗎？`:''}
        ${moved===1?`藍色的 <b>${a*a}</b> 格已經搬進大正方形，<br>
          還剩 <b>${c*c-a*a}</b> 格空著。`:''}
        ${moved===2?`<b style="color:#8fd0ff">${a*a}</b> ＋
          <b style="color:#ff9a5a">${b*b}</b> ＝
          <b style="color:#ffe38a">${c*c}</b><br>
          剛好填滿，一格不多一格不少。<br>
          <b>a² + b² = c²</b>`:''}</div>
      ${moved<2?`<button class="go" id="geoGo">把 ${moved===0?'藍色 '+a+'²':'橘色 '+b+'²'} 搬進大正方形</button>`
        :`<button class="go" id="geoDone">我看懂了</button>`}`,
      null,el=>{
        if(el.id==='geoGo'){ moved++; setTimeout(draw,10); return true; }
        if(el.id==='geoDone'){ recordQuizCorrect({tag:'畢氏定理',tier:2}); setTimeout(()=>cb(true),10); return true; }
        return false;
      });
    paint();
  };
  const paint=()=>{
    const cv=$('geoc'); if(!cv)return;
    const g=cv.getContext('2d');
    g.clearRect(0,0,320,300);
    const u=13;                               // 每格像素
    // 直角三角形：直角在左下 P0，水平股 b、垂直股 a
    const ox=104, oy=176;                     // 直角頂點
    const P0=[ox,oy], P1=[ox+b*u,oy], P2=[ox,oy-a*u];
    const grid=(x,y,n,w,h,fill,line,fillCount)=>{
      // 從左上角 (x,y) 畫 w×h 格
      let k=0;
      for(let j=0;j<h;j++)for(let i=0;i<w;i++){
        const on = fillCount===undefined || k<fillCount;
        g.fillStyle = on?fill:'#161029';
        g.fillRect(x+i*u,y+j*u,u-1,u-1);
        k++;
      }
      g.strokeStyle=line; g.lineWidth=2;
      g.strokeRect(x,y,w*u,h*u);
    };
    // c² 正方形：貼在斜邊外側
    // 斜邊向量 P1→P2，法線朝右上
    const vx=P2[0]-P1[0], vy=P2[1]-P1[1];
    const len=Math.hypot(vx,vy);
    const nx=-vy/len, ny=vx/len;              // 單位法線
    g.save();
    g.translate(P1[0],P1[1]);
    g.rotate(Math.atan2(vy,vx));
    // 在旋轉座標中，斜邊沿 +x，正方形往 -y（外側）
    let k=0;
    const filledC = moved===0?0 : moved===1? a*a : a*a+b*b;
    for(let j=0;j<c;j++)for(let i=0;i<c;i++){
      let col='#161029';
      if(k<filledC) col = (k<a*a)?'#3f7fd0':'#c98a3c';
      g.fillStyle=col;
      g.fillRect(i*u, -(j+1)*u, u-1, u-1);
      k++;
    }
    g.strokeStyle='#ecc24e'; g.lineWidth=2.5;
    g.strokeRect(0,-c*u,c*u,c*u);
    g.fillStyle='#ffe38a'; g.font='bold 13px sans-serif';
    g.fillText('c² = '+c*c, c*u/2-22, -c*u-6);
    g.restore();
    // a² 正方形：垂直股左側
    if(moved<1){
      grid(P0[0]-a*u, P2[1], a, a, a, '#3f7fd0', '#8fd0ff');
      g.fillStyle='#8fd0ff'; g.font='bold 13px sans-serif';
      g.fillText('a² = '+a*a, P0[0]-a*u+4, P2[1]-6);
    }
    // b² 正方形：水平股下方
    if(moved<2){
      grid(P0[0], P0[1], b, b, b, '#c98a3c', '#f0cf78');
      g.fillStyle='#f0cf78'; g.font='bold 13px sans-serif';
      g.fillText('b² = '+b*b, P0[0]+4, P0[1]+b*u+14);
    }
    // 三角形本體（畫在最上層）
    g.beginPath();
    g.moveTo(...P0); g.lineTo(...P1); g.lineTo(...P2); g.closePath();
    g.fillStyle='rgba(226,232,255,.22)'; g.fill();
    g.strokeStyle='#e2e8ff'; g.lineWidth=3; g.stroke();
    // 直角記號
    g.strokeStyle='#ffe38a'; g.lineWidth=2;
    g.strokeRect(P0[0],P0[1]-14,14,14);
    // 邊長標示
    g.fillStyle='#8fd0ff'; g.font='bold 12px sans-serif';
    g.fillText('a='+a, P0[0]-30, (P0[1]+P2[1])/2);
    g.fillStyle='#f0cf78';
    g.fillText('b='+b, (P0[0]+P1[0])/2-12, P0[1]+16);
    g.fillStyle='#ffe38a';
    g.fillText('c='+c, (P1[0]+P2[0])/2+6, (P1[1]+P2[1])/2-6);
  };
  draw();
}
function geoTriangleSum(cb){
  quizStats.total++;
  let torn=0;
  const A=[50+rand(40),40+rand(40)];
  const angs=[A[0],A[1],180-A[0]-A[1]];
  const draw=()=>{
    overlay(`<div class="kicker">INTERACTIVE · 三角形內角和</div>
      <h1 style="font-size:19px">把三個角撕下來拼拼看</h1>
      <div class="rank">${angs[0]}° ／ ${angs[1]}° ／ ${angs[2]}°</div>
      <canvas id="geoc" width="300" height="220"></canvas>
      <div class="desc" style="text-align:center">
        ${torn<3?`已撕下 <b>${torn}</b> 個角。點按鈕繼續。`
          :`三個角拼在一起，剛好排成一條<b>直線</b> — 平角 <b>180°</b>。<br>
            ${angs[0]} + ${angs[1]} + ${angs[2]} = <b>180</b>`}</div>
      ${torn<3?`<button class="go" id="geoGo">撕下第 ${torn+1} 個角</button>`
        :`<button class="go" id="geoDone">我看懂了</button>`}`,
      null,el=>{
        if(el.id==='geoGo'){ torn++; setTimeout(draw,10); return true; }
        if(el.id==='geoDone'){ recordQuizCorrect({tag:'三角形內角和',tier:2}); setTimeout(()=>cb(true),10); return true; }
        return false;
      });
    const cv=$('geoc'); if(!cv)return;
    const g=cv.getContext('2d'); g.clearRect(0,0,300,220);
    const P=[[60,30],[20,130],[170,130]];
    const cols=['#ff6a6a','#8fd0ff','#8fe86a'];
    // 三角形
    g.strokeStyle='#ecc24e'; g.lineWidth=2;
    g.beginPath(); g.moveTo(...P[0]); g.lineTo(...P[1]); g.lineTo(...P[2]); g.closePath(); g.stroke();
    // 未撕下的角用扇形標示
    for(let i=0;i<3;i++){
      if(i<torn) continue;
      g.fillStyle=cols[i]+'99';
      g.beginPath(); g.moveTo(...P[i]);
      const o1=P[(i+1)%3], o2=P[(i+2)%3];
      const ang1=Math.atan2(o1[1]-P[i][1],o1[0]-P[i][0]);
      const ang2=Math.atan2(o2[1]-P[i][1],o2[0]-P[i][0]);
      g.arc(P[i][0],P[i][1],22,Math.min(ang1,ang2),Math.max(ang1,ang2));
      g.closePath(); g.fill();
    }
    // 底部拼合區：畫成連續的扇形
    g.strokeStyle='#6f6490'; g.lineWidth=2;
    g.beginPath(); g.moveTo(30,195); g.lineTo(270,195); g.stroke();
    let acc=180;
    for(let i=0;i<torn;i++){
      g.fillStyle=cols[i]+'cc';
      g.beginPath(); g.moveTo(150,195);
      const st=(acc-angs[i])*Math.PI/180, en=acc*Math.PI/180;
      g.arc(150,195,46,Math.PI+st-Math.PI,Math.PI+en-Math.PI,false);
      g.closePath(); g.fill();
      acc-=angs[i];
    }
    if(torn>=3){ g.fillStyle='#ffe38a'; g.font='bold 12px sans-serif';
      g.fillText('180° 平角',110,215); }
  };
  draw();
}
const GEO_PUZZLES=[geoPythagoras,geoTriangleSum];


/* ═══════════════ 程序生成題庫 ═══════════════
   內建題庫只有 63 題，抽久了一定重複。
   這裡依冊別各寫數個生成器，每次都算出新的數字 → 題目幾乎不重複。

const lcm2=(a,b)=>Math.abs(a*b)/gcd2(a,b);

const rint=(a,b)=>a+rand(b-a+1);

const sgn=v=>v<0?'−'+Math.abs(v):''+v;
const par=v=>v<0?'('+sgn(v)+')':''+v;
const simp=(n,d)=>{const g=gcd2(n,d)||1;return [n/g,d/g];};

/* 不重複輪替：把題目洗牌後依序發，發完才重洗 */
let qQueue={};
function nextFromBank(vol){
  const src=QBANK.filter(x=>Number(x.v)===Number(vol));
  if(!src.length)return null;
  if(!qQueue[vol]||!qQueue[vol].length) qQueue[vol]=shuffle(src.map((_,i)=>i));
  const q=src[qQueue[vol].pop()];
  return q?visualizeGeometryQuestion({q:q.q,opts:q.opts,ans:q.ans,sol:q.sol,fig:q.fig||'',
    difficulty:q.difficulty||q.diff||'',tier:q.tier||0,
    tag:'第'+q.v+'冊'+(q.tag?' · '+q.tag:'')}):null;
}
function classroomBankActive(){
  return !!(classroomLaunch&&Array.isArray(classroomLaunch.questionBank)&&classroomLaunch.questionBank.length&&Array.isArray(QBANK)&&QBANK.length);
}
function dungeonActionQuestion(fallback){
  if(classroomBankActive()){
    const picked=Number(volPick),want=Number.isFinite(picked)&&picked>=1?picked:Number((zoneOf()||{}).vol)||Number(classroomLaunch.volume)||1;
    const q=nextFromBank(want)||nextFromBank(Number(classroomLaunch.volume)||1);
    if(q)return q;
  }
  const q=typeof fallback==='function'?fallback():fallback;
  return q?visualizeGeometryQuestion(q):null;
}
function dungeonActionLabel(name){return name+(classroomBankActive()?' · 教師指定單元':'');}
function mediumFacilityQuestion(){
  /* 教師指定章節永遠優先；自由探索才暫時鎖定標準（中）難度。 */
  if(classroomBankActive())return dungeonActionQuestion(null);
  const old=forceTier;forceTier=2;
  let q=null;try{q=pickQ(Number((zoneOf()||{}).vol)||1);if(q)q.tier=2;}finally{forceTier=old;}
  return q;
}
function facilityGate(pr,label,open){
  if(pr&&pr.gatePassed){open();return;}
  const q=mediumFacilityQuestion();
  if(!q){open();return;}
  quizAsk(q,ok=>{
    if(ok){if(pr)pr.gatePassed=1;toast(label+'的封印已解除',1500);open();}
    else{toast('答錯了，複習後可再挑戰',1700);backToDungeon();}
  },dungeonActionLabel(label+' · 標準難度'));
}
function enterShrineFacility(pr){facilityGate(pr,'升級神殿',()=>shrineScreen('',pr));}
function enterForgeFacility(pr){facilityGate(pr,'融合工坊',()=>{fuseSel=[];fuseQuizPassed=false;forgeProp=pr;if(pr.used)forgeSpent();else fuseScreen();});}
function enterBeastShrine(pr){facilityGate(pr,'怪物神殿',()=>{monsterFusionSel=[];beastShrineScreen(pr);});}

  // 萬用／特殊文具
  blank:'📓', clock:'⏱️', candle:'🖍️', trip:'🖇️', coin:'🪙',
  spring:'🖋️', wellspring:'✒️', scroll:'🗂️', curse:'🗒️',
  // 負費
  nDebt:'📄', nOver:'▱', nInv:'📏', nImag:'🖊️', nUnit:'🧾',
  // 數學家傳說
  gaussC:'🔢', pythaC:'📐', euclidC:'📏', fermatC:'🧩',
  pascalC:'🔺', eulerC:'🌌', archiC:'⚖', descartesC:'🧭',
  // 合成卡
  fLine:'📏', fDist:'📓', fSquare:'📋', fMul:'🔖', fSeries:'🖋️',
  fDiff:'📐', fQuad:'📊', fPerfect:'🗂️', fArith:'🧮',
  fDisc:'🧾', fGauss:'📈',
};
function cardIcon(c,id){
  if(c&&/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(String(c.iconData||'')))return '<img src="'+hesc(c.iconData)+'" alt="'+hesc(c.n||'裝備')+'">';
  if(id&&CARD_ICON[id]) return CARD_ICON[id];
  // 沒有專屬圖示時依效果推斷（保底，不會出現空白）
  if(!c) return '⚔';
  if(c.CURSE) return '💀';
  if(c.wild)  return '✦';
  if(c.neg)   return '⟲';
  if(c.sp)    return '📐';
  if(c.capUp) return '📜';
  if(c.manaGain) return '💧';
  if(c.block && !c.dmg) return '🛡';
  if(!c.dmg && c.draw) return '📖';
  if(c.all)   return '💥';
  if((c.hits||1)>1) return '🗡';
  if(c.burn)  return '🔥';
  if(c.drain) return '🩸';
  return '⚔';
}
function queueCardAnim(o,targetUid,hits,chain){
  animQ.push({o,targetUid,hits:hits||[],chain:chain||1});
  renderAnimQ();
  runAnimQ();
}
function renderAnimQ(){
  const w=$('animQ'); if(!w)return;
  const cnt2=$('animCnt');
  if(cnt2){
    const n=animQ.length+animActive;
    cnt2.textContent=n>1?('連鎖 ×'+n):'';
    cnt2.classList.toggle('hot',n>=4);
  }
  w.innerHTML=animQ.slice(0,6).map((it,i)=>{
    const c=effCard(it.o);
    return `<div class="qchip" style="opacity:${1-i*0.13}">
      <span class="qi">${cardIcon(c,it.o&&it.o.id)}</span><span class="qc">${cardCostText(c)}</span></div>`;
  }).join('');
  w.classList.toggle('hide',!animQ.length);
  const cnt=$('animCnt');
  if(cnt){ cnt.textContent=animQ.length>1?('×'+animQ.length):''; }
}
let animActive=0, animPaused=false;
/* 前一版把動畫壓到 70ms 以「跟上手速」，結果佇列瞬間清空、看不到累積效果。
   正確做法是解耦：輸入永遠即時，動畫拉長到看得清楚，
   但允許同時播 3 個並錯開launch → 連點後會看到一整串連續演出。 */
function runAnimQ(){
  if(animPaused) return;
  let launched=0;
  while(animActive<3 && animQ.length){
    const item=animQ.shift();
    animActive++;
    const dur = animQ.length>=6?300 : animQ.length>=3?360 : 420;
    const delay=launched*90;               // 錯開起飛，形成連續感
    launched++;
    setTimeout(()=>{
      playFx(item,dur,()=>{
        animActive--;
        renderAnimQ();
        runAnimQ();
      });
    },delay);
  }
  renderAnimQ();
  if(!animQ.length && animActive===0) animRunning=false;
}
function flyCard(item,dur,done){
  const field=$('field');
  if(!field){ done&&done(); return; }
  const c=effCard(item.o);
  const el=document.createElement('div');
  el.className='flycard';
  el.innerHTML=`<span class="fi">${cardIcon(c,item.o&&item.o.id)}</span>`;
  // 起點：右側佇列；終點：目標敵人（沒有就打中央）
  const fw=field.clientWidth, fh=field.clientHeight;
  let tx=fw*0.5, ty=fh*0.45;
  const t=document.getElementById(item.targetUid);
  if(t){ tx=parseFloat(t.style.left||0)+parseFloat(t.style.width||60)/2;
         ty=parseFloat(t.style.top||0)+30; }
  el.style.left=(fw-46)+'px';
  el.style.top=(fh*0.62)+'px';
  field.appendChild(el);
  requestAnimationFrame(()=>{
    el.style.transition=`left ${dur}ms cubic-bezier(.4,0,.7,1), top ${dur}ms cubic-bezier(.4,0,.7,1), transform ${dur}ms`;
    el.style.left=(tx-20)+'px';
    el.style.top=(ty-20)+'px';
    el.style.transform='scale(1.5) rotate(-18deg)';
  });
  setTimeout(()=>{
    el.classList.add('burst');
    if(t){ t.classList.remove('hurt'); void t.offsetWidth; t.classList.add('hurt'); }
    setTimeout(()=>{ el.remove(); done&&done(); },30);
  },dur);
}



/* ═══════════════ 出牌瞬間的卡片飛出 ═══════════════
   點下去的那張卡會化成殘影衝向戰場 —— 把「我打了這張」的因果連起來。 */
function cardLaunch(el){
  if(!el)return;
  const field=$('field'); if(!field)return;
  const r=el.getBoundingClientRect(), fr=field.getBoundingClientRect();
  const ghost=el.cloneNode(true);
  ghost.className='cardGhost';
  ghost.style.left=(r.left-fr.left)+'px';
  ghost.style.top=(r.top-fr.top)+'px';
  ghost.style.width=r.width+'px';
  ghost.style.height=r.height+'px';
  field.appendChild(ghost);
  requestAnimationFrame(()=>ghost.classList.add('go'));
  setTimeout(()=>ghost.remove(),420);
}
/* 命中停格：大傷害時短暫凍結，讓打擊感落地 */
let hitStopUntil=0;
function hitStop(ms){
  const b=$('battle'); if(!b)return;
  hitStopUntil=Date.now()+ms;
  b.classList.add('hitstop');
  setTimeout(()=>{ if(Date.now()>=hitStopUntil) b.classList.remove('hitstop'); },ms);
}
/* 投射物拖尾：沿路灑下淡出的光點 */
const FX_SEL='.fx-blade,.fx-fire,.fx-drop,.fx-spark,.fx-mote,.fx-ring,.fx-orbit,.fx-trail,.fx-bolt';
const FX_LIMIT=46;
function emitTrail(field,el,dur,color,count){
  let n=0;
  const iv=setInterval(()=>{
    if(n++>=count||!el.isConnected){ clearInterval(iv); return; }
    // 拖尾也必須受特效上限管制，否則會繞過保護把 DOM 撐爆
    if(field.querySelectorAll(FX_SEL).length>=FX_LIMIT) return;
    const t=document.createElement('i');
    t.className='fx-trail';
    t.style.left=el.style.left; t.style.top=el.style.top;
    t.style.background=color||'#ffe38a';
    field.appendChild(t);
    setTimeout(()=>t.remove(),380);
  },Math.max(40,dur/(count+1)));
}


/* ═══════════════ 卡牌詳情面板（像素 RPG 風格）═══════════════
   參考裝備詳情的資訊層次：品質標籤 → 大數值 → 雙欄屬性 → 鑲嵌效果。
   讓學生一眼看懂「這張卡強在哪」，而不是只看到小卡片上的兩行字。 */
const RARITY_TAG={C:'普通',R:'魔法[稀有]',E:'魔法[精英]',L:'傳說[神話]'};
/* 綜合威力：把傷害、段數、護盾、抽牌換算成一個可比較的數字 */
function cardPower(o){
  const c=effCard(o);
  let pw=(c.dmg||0)*(c.hits||1)*(c.all?1.6:1);
  pw+=(c.block||0)*0.9;
  pw+=(c.draw||0)*14;
  pw+=(c.manaGain||0)*18;
  pw+=(c.burn||0)*1.5;
  if(c.wild) pw+=25;                       // 萬用卡的價值在於維持連擊
  if(c.neg) pw+=20;
  if(c.sp) pw+=40;
  const costFactor=c.wild?1:(1+(c.c||0)*0.15);
  return Math.round(pw*100/costFactor);
}

/* ═══════════════ 卡牌專屬攻擊特效 ═══════════════
   每張卡依名稱與性質有各自的演出；稀有度越高疊加越多層次。
   所有特效都是純視覺，不影響邏輯 —— 出牌永遠立即生效。 */
const CARD_FX={
  // 鉛筆／筆芯系：連續投射
  knife:'volley', dagger:'volley', edge:'volley',
  // 捲尺系：弧形彈擊
  whip:'lash', bloody:'lash',
  // 原子筆系：貫穿墨光
  wand:'beam', holy:'beam', descartesC:'beam',
  // 擴散系：全體環擊
  garlic:'ring', poe:'ring', heaven:'ring', fDisc:'ring',
  // 火系：連發火球（重擊與爆發類）
  water:'fireball', bloody:'fireball', gun:'fireball', axe:'fireball',
  pasqua:'fireball', fDist:'fireball', nImag:'fireball',
  // 課本系：環繞書頁
  bible:'orbit', vespers:'orbit', imelda:'orbit', fSeries:'orbit',
  // 三角板系：交叉光線
  cross:'cross', fQuad:'cross',
  // 護盾系
  guard:'shield', pebble:'shield', fSquare:'shield', fPerfect:'shield',
  // 萬用：序列漣漪
  blank:'ripple', clock:'ripple', candle:'ripple', trip:'ripple',
  eulerC:'ripple', spring:'ripple', wellspring:'ripple', coin:'ripple',
  // 負費：逆向吸取
  nDebt:'drain', nOver:'drain', nInv:'drain', nImag:'drain', nUnit:'drain',
  // 增益／詛咒：專屬演出
  antonio:'buff', scroll:'buff', curse:'hex',
  // 數學家與合成：公式爆發
  gaussC:'formula', pythaC:'formula', euclidC:'formula', fermatC:'formula',
  pascalC:'formula', archiC:'formula',
  fLine:'formula', fQuad:'formula', fArith:'formula', fGauss:'formula',
  fSeries:'orbit', fDiff:'volley', fMul:'beam',
};
const FX_FORMULA={
  gaussC:'n(n+1)/2', pythaC:'a²+b²', euclidC:'gcd(a,b)', fermatC:'aⁿ+bⁿ',
  pascalC:'ⁿCᵣ', archiC:'F₁d₁=F₂d₂', eulerC:'e^iπ+1=0',
  fLine:'y=ax+b', fQuad:'ax²+bx+c', fArith:'Sₙ=n(a₁+aₙ)/2',
  fGauss:'Σ', fDisc:'b²−4ac', fPerfect:'(a+b)²', fDist:'a(b+c)',
};
function fxStyle(o){
  const c=effCard(o);
  if(CARD_FX[o.id]) return CARD_FX[o.id];
  if(c.burn) return 'fireball';
  if(c.wild) return 'ripple';
  if(c.neg) return 'drain';
  if(c.block&&!c.dmg) return 'shield';
  if(c.all) return 'ring';
  if((c.hits||1)>1) return 'volley';
  return 'slash';
}
function mkFx(cls,style){
  const e=document.createElement('div');
  e.className=cls;
  if(style) Object.assign(e.style,style);
  return e;
}
/* 主特效播放器 */
function playFx(item,dur,done){
  const field=$('field');
  if(!field){ done&&done(); return; }
  const o=item.o, c=effCard(o), st=fxStyle(o);
  const rare=(c.r==='L'||c.r==='E'||c.FUSE);
  const fw=field.clientWidth, fh=field.clientHeight;
  let tx=fw*0.5, ty=fh*0.42;
  const t=document.getElementById(item.targetUid);
  if(t){ tx=parseFloat(t.style.left||0)+parseFloat(t.style.width||60)/2;
         ty=parseFloat(t.style.top||0)+34; }
  const sx=fw-40, sy=fh*0.66;
  // 效能保護：同時存在的特效元素超過上限就不再新增
  // （3 個並行動畫 × 14 投射物 + 火花，極端情況可達 60+ 個 DOM）
  const add=el=>{
    if(field.querySelectorAll(FX_SEL).length>=FX_LIMIT){
      el.remove?.(); return;
    }
    field.appendChild(el);
    setTimeout(()=>el.remove(),dur+700);
  };
  const col=RARITY[c.r||'C'].col;

  const chainN=item.chain||1;
  // 投射物數量：基礎 + 命中次數 + 連擊加成，數量越多動畫自然越長
  let pn=Math.min(14, 4 + (c.hits||1)*2 + Math.floor(chainN/2));
  // 佇列很滿時自動減量，優先保住流暢度
  if(animQ.length>=4) pn=Math.max(4,Math.round(pn*0.6));
  const stag=Math.max(26, Math.round(dur*0.5/pn));   // 逐發錯開
  const span=dur + (pn-1)*stag;                      // 全部落地才算結束
  if(st==='volley'){                      // 連續鉛筆／筆芯
    const n=pn;
    for(let i=0;i<n;i++){
      const b=mkFx('fx-blade',{left:sx+'px',top:sy+'px',color:col});
      add(b);
      setTimeout(()=>{ if(animQ.length<3) emitTrail(field,b,dur,col,3);
        b.style.transition=`left ${dur}ms cubic-bezier(.3,0,.7,1), top ${dur}ms cubic-bezier(.3,0,.7,1), transform ${dur}ms`;
        b.style.left=(tx-13+(Math.random()-0.5)*30)+'px';
        b.style.top=(ty-13+(Math.random()-0.5)*34)+'px';
        b.style.transform='rotate(900deg)'; }, i*stag);
    }
  } else if(st==='lash'){                 // 鞭擊弧線
    const l=mkFx('fx-lash',{left:tx+'px',top:ty+'px'});
    add(l);
  } else if(st==='beam'){                 // 貫穿光束
    const b=mkFx('fx-beam',{left:tx+'px',top:'0px',height:(ty+20)+'px',background:
      `linear-gradient(180deg,transparent,${col},#fff)`});
    add(b);
  } else if(st==='ring'){                 // 全體環擊
    const rn=Math.min(9,4+Math.floor(chainN/3));
    for(let i=0;i<rn;i++){
      const r=mkFx('fx-ring',{left:(fw/2)+'px',top:(fh*0.42)+'px',borderColor:col});
      r.style.animationDelay=(i*70)+'ms';
      add(r);
    }
  } else if(st==='fireball'){             // 連發火球
    for(let i=0;i<pn;i++){
      const fb=mkFx('fx-fire',{left:sx+'px',top:sy+'px'});
      fb.innerHTML='<i class="core"></i><i class="tail"></i>';
      add(fb);
      setTimeout(()=>{
        if(animQ.length<3) emitTrail(field,fb,dur,'#ff8a3a',4);
        fb.style.transition=`left ${dur}ms cubic-bezier(.35,0,.65,1), top ${dur}ms cubic-bezier(.35,0,.65,1), transform ${dur}ms`;
        fb.style.left=(tx-14+(Math.random()-0.5)*44)+'px';
        fb.style.top=(ty-14+(Math.random()-0.5)*38)+'px';
        fb.style.transform='scale(1.5)';
        setTimeout(()=>fb.classList.add('boom'),dur-40);
      }, i*stag);
    }
  } else if(st==='splash'){               // 潑濺
    for(let i=0;i<pn+6;i++){
      const d=mkFx('fx-drop',{left:tx+'px',top:ty+'px'});
      const a=Math.random()*Math.PI*2, r=22+Math.random()*26;
      d.style.setProperty('--dx',(Math.cos(a)*r)+'px');
      d.style.setProperty('--dy',(Math.sin(a)*r)+'px');
      add(d);
    }
  } else if(st==='orbit'){                // 環繞書頁
    for(let i=0;i<Math.min(7,3+Math.floor(chainN/3));i++){
      const g=mkFx('fx-orbit',{left:tx+'px',top:ty+'px',borderColor:col});
      g.style.animationDelay=(i*90)+'ms';
      add(g);
    }
  } else if(st==='cross'){                // 光之十字
    add(mkFx('fx-crossV',{left:tx+'px',background:`linear-gradient(180deg,transparent,${col},transparent)`}));
    add(mkFx('fx-crossH',{top:ty+'px',background:`linear-gradient(90deg,transparent,${col},transparent)`}));
  } else if(st==='shield'){               // 護盾浮現（玩家側）
    const sh=mkFx('fx-shield',{left:(fw/2-30)+'px',top:(fh-70)+'px'});
    sh.textContent='🛡';
    add(sh);
  } else if(st==='ripple'){               // 序列重置漣漪
    for(let i=0;i<3;i++){
      const r=mkFx('fx-ripple',{left:(fw/2)+'px',top:(fh*0.5)+'px',borderColor:'#e26bd6'});
      r.style.animationDelay=(i*110)+'ms';
      add(r);
    }
  } else if(st==='drain'){                // 逆向吸取（敵→我）
    for(let i=0;i<pn;i++){
      const d=mkFx('fx-mote',{left:tx+'px',top:ty+'px'});
      d.style.setProperty('--tx',(fw/2-tx)+'px');
      d.style.setProperty('--ty',(fh-40-ty)+'px');
      d.style.animationDelay=(i*60)+'ms';
      add(d);
    }
  } else if(st==='formula'){              // 公式爆發（傳說／合成）
    const extra=Math.min(8,Math.floor(chainN/3));
    for(let i=0;i<extra;i++){
      const sp2=mkFx('fx-spark',{left:tx+'px',top:ty+'px',background:'#fff'});
      const a2=Math.random()*Math.PI*2, r2=30+Math.random()*40;
      sp2.style.setProperty('--dx',(Math.cos(a2)*r2)+'px');
      sp2.style.setProperty('--dy',(Math.sin(a2)*r2)+'px');
      sp2.style.animationDelay=(i*40)+'ms';
      add(sp2);
    }
    const f=mkFx('fx-formula',{left:tx+'px',top:(ty-18)+'px',color:col});
    f.textContent=FX_FORMULA[o.id]||'∑';
    add(f);
    const spn=Math.min(20,10+chainN);
    for(let i=0;i<spn;i++){
      const sp=mkFx('fx-spark',{left:tx+'px',top:ty+'px',background:col});
      const a=i/spn*Math.PI*2;
      sp.style.setProperty('--dx',(Math.cos(a)*46)+'px');
      sp.style.setProperty('--dy',(Math.sin(a)*46)+'px');
      add(sp);
    }
  } else if(st==='buff'){                 // 增益：向上升起的雙箭頭光暈
    for(let i=0;i<4;i++){
      const u=mkFx('fx-buff',{left:(fw/2+(i-1.5)*16)+'px',top:(fh-56)+'px',color:col});
      u.textContent='▲';
      u.style.animationDelay=(i*70)+'ms';
      add(u);
    }
  } else if(st==='hex'){                  // 詛咒：紫色迴旋符文
    const hx=mkFx('fx-hex',{left:(fw/2)+'px',top:(fh*0.5)+'px'});
    hx.textContent='✖';
    add(hx);
  } else {                                 // 預設：斬擊
    const sl=mkFx('fx-slash',{left:tx+'px',top:ty+'px',background:
      `linear-gradient(90deg,transparent,${col},transparent)`});
    add(sl);
  }

  // 全螢幕連擊演出：連擊越高越華麗
  if(chainN>=5){
    const st1=mkFx('fx-streak',{background:`linear-gradient(90deg,transparent,${col},transparent)`});
    st1.style.top=(Math.random()*fh)+'px';
    add(st1);
  }
  if(chainN>=10){
    const rb=mkFx('fx-radial');
    add(rb);
    for(let i=0;i<10;i++){
      const ln=mkFx('fx-ray',{background:col});
      ln.style.transform=`rotate(${i*36}deg) translateX(30px)`;
      rb.appendChild(ln);
    }
  }
  if(chainN>=12){                          // 電弧：從畫面邊緣劈向目標
    for(let i=0;i<4;i++){
      const lz=mkFx('fx-bolt',{background:`linear-gradient(90deg,transparent,${col},#fff)`});
      lz.style.left=(tx-90)+'px'; lz.style.top=(ty-60+i*30)+'px';
      lz.style.transform=`rotate(${-30+i*20}deg)`;
      lz.style.animationDelay=(i*55)+'ms';
      add(lz);
    }
  }
  if(chainN>=15){
    const fs=mkFx('fx-fullflash',{background:col});
    add(fs);
    const vx=mkFx('fx-vortex',{borderColor:col});   // 能量漩渦
    vx.style.left=tx+'px'; vx.style.top=ty+'px';
    add(vx);
  }
  if(chainN>=20){                          // 20 連：畫面級爆發
    for(let i=0;i<3;i++){
      const rg=mkFx('fx-megaring',{borderColor:'#fff'});
      rg.style.left=tx+'px'; rg.style.top=ty+'px';
      rg.style.animationDelay=(i*90)+'ms';
      add(rg);
    }
    hitStop(150);
  }
  // 連擊越高，命中回饋越強
  if(chainN>=8){
    const w2=mkFx('fx-shock',{left:tx+'px',top:ty+'px',borderColor:'#ffe38a'});
    w2.style.animationDelay='60ms';
    add(w2);
  }
  shakeByChain(chainN);   // 連擊 3 起就開始晃，越高越劇烈
  // 連擊 5 起追加全畫面演出，10 與 15 再升級
  if(chainN===2||chainN===4||chainN===5||chainN===6) cineCard(item.o,chainN);
  // 稀有卡疊加華麗層：衝擊波＋畫面閃光＋震動
  if(rare){
    const w=mkFx('fx-shock',{left:tx+'px',top:ty+'px',borderColor:col});
    add(w);
    const fl=mkFx('fx-flash',{background:col});
    add(fl);
    shake();
  }
  setTimeout(()=>{
    if(t){ t.classList.remove('hurt'); void t.offsetWidth; t.classList.add('hurt'); }
    // 命中衝擊：光環 + 停格（傷害越大停越久）
    const totalDmg=(item.hits||[]).reduce((a,h)=>a+h.d,0);
    if(t&&totalDmg>0){
      const imp=mkFx('fx-impact',{left:tx+'px',top:ty+'px',borderColor:col});
      add(imp);
      if(totalDmg>=40) hitStop(chainN>=8?110:70);
      else if(totalDmg>=18) hitStop(45);
    }
    // 把傷害拆成連續多段跳出 —— 連擊越長段數越多，打擊感越爆
    // 重要：各段數字加總必須等於實際傷害（學生可能會去加）
    for(const h of (item.hits||[])){
      const f=B&&B.foes?B.foes.find(x=>x.uid===h.uid):null;
      if(!f)continue;
      const ticks=splitDamage(h.d,item.chain,(effCard(item.o).hits||1));
      const gap=Math.max(45,Math.round(span*0.35/Math.max(1,ticks.length)));
      ticks.forEach((v,k)=>{
        setTimeout(()=>{
          if(!B||B.over)return;
          popDmg(f,v,h.crit&&k===ticks.length-1,k===0?(h.pre||''):'');
        }, k*gap);
      });
    }
    done&&done();
  },span);
}

let quizStats={ok:0,total:0,points:0};
let quizLastAnswerSlot=-1;
/* 所有地下城題目共用同一套知識點規則：基礎 1、標準 2、挑戰 3。
   題庫若有 difficulty / diff / tier 會優先採用；舊題則依主題精熟度判定。 */
function questionKnowledgePoints(q){
  q=q||{};
  const raw=q.difficulty!==undefined&&q.difficulty!==''?q.difficulty:
    (q.diff!==undefined&&q.diff!==''?q.diff:q.tier);
  const n=Number(raw);
  if(Number.isFinite(n)&&n>0)return Math.max(1,Math.min(3,Math.round(n)));
  const s=String(raw||'').toLowerCase();
  if(/挑戰|困難|進階|高階|hard|advanced|expert|3/.test(s))return 3;
  if(/標準|中等|普通|medium|normal|2/.test(s))return 2;
  if(/基礎|簡單|入門|easy|basic|1/.test(s))return 1;
  return Math.max(1,Math.min(3,tierFor(String(q.tag||'').replace(/^第\d+冊\s*·?\s*/,''))||1));
}
function recordQuizCorrect(q){
  const points=questionKnowledgePoints(q);
  quizStats.ok++;
  quizStats.points=(Number(quizStats.points)||0)+points;
  return points;
}
function quizAsk(q,cb,label){
  quizStats.total++;
  let opts=q.opts.slice();for(let i=0;i<8;i++){opts=shuffle(opts.slice());const slot=opts.indexOf(q.ans);if(slot>=0&&(slot!==quizLastAnswerSlot||i===7)){quizLastAnswerSlot=slot;break;}}
  overlay(`<div class="kicker">${label||'MATH'}${q.tag?' · '+q.tag:''}${
      q.tier?' · '+TIER_NAME[q.tier]:''}</div>
    <h1 style="font-size:19px;line-height:1.5">${q.q}</h1>
    ${q.fig?`<div class="qfig">${q.fig}</div>`:''}
    <div id="qopts">${opts.map(o=>
      `<div class="qopt" data-v="${o}">${q.fig?geometryOptionBadge(o):''}${o}</div>`).join('')}</div>`,null,el=>{
      const row=el.closest('.qopt'); if(!row)return false;
      const ok=row.dataset.v===q.ans;
      recordTopic(q.tag,ok);
      const points=ok?recordQuizCorrect(q):0;
      if(ok)questAdd(volPick==='auto'?Number((zoneOf()||{}).vol)||1:volPick);
      creditQuiz(ok);
      setTimeout(()=>quizResult(q,ok,cb,points),10);
      return true;
    });
  $('veilCard').classList.add('quiz-card');
}
function quizResult(q,ok,cb,points){
  if(!ok) recordWrong(q);
  const figHtml=q.fig?`<div class="qfig small">${q.fig}</div>`:'';
  overlay(`<div class="kicker">${ok?'CORRECT':'INCORRECT'}</div>
    <h1 style="color:${ok?'#8fe86a':'#ff6a6a'};text-shadow:0 3px 0 ${ok?'#14400a':'#4a0808'}">
      ${ok?'答對了！':'答錯了'}</h1>
    <div class="rank" style="${ok?'':'color:#ff6a6a;border-color:#ff6a6a;background:rgba(255,90,90,.1)'}">
      正解：${q.ans}${ok?`　✦ 知識點 +${points||questionKnowledgePoints(q)}`:''}</div>
    <div class="desc">${q.sol}</div>
    <button class="go" id="ok">繼續</button>`,()=>cb(ok));
}
let lastQText='';
const pickQ=vol=>{
  const want = volPick==='auto' ? vol : volPick;
  /* 班級作業已勾選課程目錄時，從「目錄題目＋地下城同單元題型」混合池出題。 */
  if(classroomLaunch&&Array.isArray(classroomLaunch.questionBank)&&classroomLaunch.questionBank.length){
    const assigned=nextFromBank(Number(want))||nextFromBank(Number(classroomLaunch.volume)||1);
    if(assigned){lastQText=assigned.q;return assigned;}
  }
  let out=null;
  for(let t=0;t<6;t++){
    // 60% 用程序生成（幾乎不重複），40% 從題庫輪替
    const gens=QGEN[want];
    if(gens && Math.random()<0.6){
      const g=gens[rand(gens.length)]();
      out=visualizeGeometryQuestion({q:g.q,opts:g.opts,ans:g.ans,sol:g.sol,fig:g.fig||'',tier:g.tier||0,difficulty:g.difficulty||'',tag:'第'+want+'冊 · '+g.tag});
    }else{
      out=nextFromBank(want) || (gens?(()=>{const g=gens[rand(gens.length)]();
        return visualizeGeometryQuestion({q:g.q,opts:g.opts,ans:g.ans,sol:g.sol,fig:g.fig||'',tier:g.tier||0,difficulty:g.difficulty||'',tag:'第'+want+'冊 · '+g.tag});})():null);
    }
    if(out && out.q!==lastQText) break;      // 避免和上一題完全一樣
  }
  if(out) lastQText=out.q;
  return out||{q:'1 + 1 = ?',opts:['1','2','3','4'],ans:'2',sol:'基本加法',tag:'備用'};
};

const DIRV=[[0,-1],[1,0],[0,1],[-1,0]];
function bfsStep(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return null;
  const K=(x,y)=>y*MW+x,prev=new Map([[K(sx,sy),null]]),q=[[sx,sy]];
  for(let h=0;h<q.length;h++){
    const [x,y]=q[h];
    if(x===tx&&y===ty){
      let cur=K(x,y);
      while(true){const p=prev.get(cur);if(!p)return null;
        if(prev.get(K(p[0],p[1]))===null)return [x0(cur),y0(cur)];
        cur=K(p[0],p[1]);}
    }
    for(const [dx,dy] of DIRV){
      const nx=x+dx,ny=y+dy;
      if(!walkable(nx,ny)||prev.has(K(nx,ny)))continue;
      if(mobs.some(m=>m.alive&&m.x===nx&&m.y===ny)&&!(nx===tx&&ny===ty))continue;
      prev.set(K(nx,ny),[x,y]);q.push([nx,ny]);
    }
  }
  function x0(k){return k%MW;} function y0(k){return (k/MW)|0;}
  return null;
}
function bfsDist(sx,sy,tx,ty){
  const K=(x,y)=>y*MW+x,d=new Map([[K(sx,sy),0]]),q=[[sx,sy]];
  for(let h=0;h<q.length;h++){
    const [x,y]=q[h],dd=d.get(K(x,y));
    if(x===tx&&y===ty)return dd;
    for(const [dx,dy] of DIRV){
      const nx=x+dx,ny=y+dy;
      if(!walkable(nx,ny)||d.has(K(nx,ny)))continue;
      d.set(K(nx,ny),dd+1);q.push([nx,ny]);
    }
  }
  return 99;
}
function losClear(x0,y0,x1,y1){
  const st=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2;
  for(let i=1;i<st;i++){
    const ix=Math.round(x0+(x1-x0)*i/st),iy=Math.round(y0+(y1-y0)*i/st);
    if(!walkable(ix,iy))return false;
  }
  return true;
}
function inCone(m,tx,ty,depth=5){
  const [dx,dy]=DIRV[m.dir],sx=-dy,sy=dx,rx=tx-m.x,ry=ty-m.y;
  const f=rx*dx+ry*dy;
  if(f<1||f>depth)return false;
  if(Math.abs(rx*sx+ry*sy)>Math.floor(f/2))return false;
  return losClear(m.x,m.y,tx,ty);
}
function coneTiles(m,depth=5){
  const out=[],[dx,dy]=DIRV[m.dir],sx=-dy,sy=dx;
  for(let f=1;f<=depth;f++)for(let s=-(f>>1);s<=(f>>1);s++){
    const tx=m.x+dx*f+sx*s,ty=m.y+dy*f+sy*s;
    if(walkable(tx,ty)&&losClear(m.x,m.y,tx,ty))out.push([tx,ty]);
  }
  return out;
}

const P={x:0,y:0,dir:0,ax:0,ay:0,ang:0,aang:0};
function markSeen(){
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const x=P.x+dx,y=P.y+dy;
    if(x>=0&&y>=0&&x<MW&&y<MH)seen[y][x]=1;
  }
}
function moveMob(m,nx,ny){
  if(mobs.some(o=>o.alive&&o!==m&&o.x===nx&&o.y===ny))return;
  const dx=nx-m.x,dy=ny-m.y;
  m.prevX=m.x;m.prevY=m.y;m.prevDir=m.dir;
  m.dir=dx===1?1:dx===-1?3:dy===1?2:0;
  m.x=nx;m.y=ny;
}
function mobStep(m){
  if(m.state==='alert'){
    const st=bfsStep(m.x,m.y,P.x,P.y);
    if(st)moveMob(m,st[0],st[1]);
  }else{
    if(!m.path||!m.path.length){
      for(let t=0;t<12;t++){
        const tx=m.hx+rand(9)-4,ty=m.hy+rand(9)-4;
        if(walkable(tx,ty)&&bfsDist(m.hx,m.hy,tx,ty)<=6){m.path=[tx,ty];break;}
      }
    }
    if(m.path&&m.path.length){
      const st=bfsStep(m.x,m.y,m.path[0],m.path[1]);
      if(st)moveMob(m,st[0],st[1]);else m.path=[];
      if(m.x===m.path[0]&&m.y===m.path[1])m.path=[];
    }
  }
}
function worldTick(){
  turnNo++;$('turnN').textContent='TURN '+turnNo;
  let spotted=false,engage=[];
  for(const m of mobs){
    if(!m.alive||m.inBattle)continue;
    if(inCone(m,P.x,P.y)){
      if(m.state!=='alert'){m.state='alert';spotted=true;}
      m.lost=0;
    }else if(m.state==='alert'&&++m.lost>4){m.state='patrol';m.path=[];}
    if(++m.tick>=m.speed){m.tick=0;mobStep(m);}
    if(m.x===P.x&&m.y===P.y)engage.push(m);   // 踏進同一格 → 開戰
  }

}

const MOVE_MS=185,TURN_MS=135;let busy=false;
function act(a){
  if(busy||!running)return;
  if(a==='tl'||a==='tr'){
    P.dir=(P.dir+(a==='tl'?3:1))%4;P.ang=P.dir*Math.PI/2;startAnim('turn');return;
  }
  const [fx,fy]=DIRV[P.dir],[rx,ry]=DIRV[(P.dir+1)%4];
  let dx=0,dy=0;
  if(a==='fw'){dx=fx;dy=fy;}else if(a==='bk'){dx=-fx;dy=-fy;}
  else if(a==='sl'){dx=-rx;dy=-ry;}else if(a==='sr'){dx=rx;dy=ry;}
  if(a!=='wait'){
    const nx=P.x+dx,ny=P.y+dy;
    // 封印門：解一元一次方程式才能開啟
    if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&grid[ny][nx]==='L'&&!S.key){ doorPuzzle(); return; }
    if(!walkable(nx,ny)){
      const mk=murals[nx+','+ny];
      if(mk){ muralEvent(mk,nx+','+ny); return; }     // 壁畫：撞上去就互動
      bump();return;
    }
    const mob=mobs.find(m=>m.alive&&m.x===nx&&m.y===ny);
    if(mob){chargeInto(mob);return;}      // 主動衝擊 → 直接開戰
    P.x=nx;P.y=ny;

}

function chargeInto(m){

function startAnim(kind){
  busy=true;
  const t0=performance.now(),fx=P.ax,fy=P.ay,fa=P.aang;
  let ta=P.ang;
  while(ta-fa>Math.PI)ta-=Math.PI*2;
  while(ta-fa<-Math.PI)ta+=Math.PI*2;
  const dur=kind==='turn'?TURN_MS:MOVE_MS;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-((-2*k+2)**2)/2;
    P.ax=fx+(P.x-fx)*e;P.ay=fy+(P.y-fy)*e;P.aang=fa+(ta-fa)*e;
    if(k<1)requestAnimationFrame(step);
    else{P.ax=P.x;P.ay=P.y;P.aang=P.ang;busy=false;if(kind==='move')afterMove();}
  })(t0);
}

const SWIPE_MIN=26;
let gsX=0,gsY=0,gsId=null,gsDown=false;

function gEnd(x,y){
  const dx=x-gsX, dy=y-gsY, ax=Math.abs(dx), ay=Math.abs(dy);

}

const DIFFS={
  easy:{n:'輕鬆',ms:3800,hp:0.85,atk:.9,d:'援軍慢 · 敵人血少'},
  normal:{n:'標準',ms:2800,hp:1,atk:1.15,d:'預設平衡'},
  hard:{n:'困難',ms:2000,hp:1.25,atk:1.4,d:'援軍快 · 敵人強悍'},
};

/* 防禦採每回合上限制，避免多張裝備卡堆到永久無傷；高區域／高等級只小幅提高上限。 */
function playerShieldCap(){
  const lv=Math.max(1,Number(S.classroomLevel||S.lv)||1);
  return Math.min(44,26+(S.zone||0)*3+Math.floor(lv/30)*3);
}
function gainPlayerBlock(amount,delay){
  if(!B)return 0;
  const before=B.block||0,cap=playerShieldCap();B.block=Math.min(cap,before+Math.max(0,Math.round(amount)||0));
  const gained=B.block-before;if(gained)popPlayer('+'+gained+' 🛡','gain',delay||0);
  if(gained<Math.max(0,Math.round(amount)||0))toast('護盾已達本回合上限 '+cap,1050);
  return gained;
}
function enemyAttackScale(){
  const lv=Math.max(1,Number(S.classroomLevel||S.lv)||1);
  const importedCatchup=Math.min(.25,
    Math.max(0,(Number(S.maxhp)||100)-100)/1000+Math.max(0,Number(S.armor)||0)/250);
  return (DIFFS[diff].atk||1)*1.08*(1+(S.zone||0)*.07)*(1+Math.min(.18,(lv-1)/500))*(1+importedCatchup);
}

const FRONT_CAP=4;   // 前排最多站 4 隻，之後排到後排

/* 接敵方位判定 —— 誰先看見誰、誰主動撞上去，決定先手 */
function engagementType(m,byPlayer,contact){
  const px=contact&&Number.isFinite(contact.playerX)?contact.playerX:P.x;
  const py=contact&&Number.isFinite(contact.playerY)?contact.playerY:P.y;
  const mx=contact&&Number.isFinite(contact.monsterX)?contact.monsterX:(!byPlayer&&Number.isFinite(m.prevX)?m.prevX:m.x);
  const my=contact&&Number.isFinite(contact.monsterY)?contact.monsterY:(!byPlayer&&Number.isFinite(m.prevY)?m.prevY:m.y);
  const mdir=contact&&Number.isFinite(contact.monsterDir)?contact.monsterDir:m.dir;
  const dx=mx-px, dy=my-py;
  const rel = Math.abs(dx)>Math.abs(dy) ? (dx>0?1:3) : (dy>0?2:0); // 玩家→怪 的方位
  const [mfx,mfy]=DIRV[mdir];
  const mFacingPlayer = mdir === (rel+2)%4;   // 怪的正面朝著玩家
  const behindMonster = px===mx-mfx&&py===my-mfy; // 玩家確實站在怪物背後一格
  const fromBehind = rel === (P.dir+2)%4;      // 怪在玩家背後
  if(byPlayer){
    if(behindMonster) return 'ambush';         // 只有真正從背後接觸才算突襲
    if(m.state!=='alert') return 'preempt';    // 牠還沒發現你
    return 'normal';                           // 正面或側面接觸都不算背刺
  }
  if(m.state!=='alert'||!mFacingPlayer) return 'preempt';
  if(fromBehind) return 'back';
  return 'normal';
}

function startBattle(list,byPlayer,contact){
  running=false;

  const kind=engagementType(lead,!!byPlayer,contact);
  const isPre = kind==='preempt'||kind==='ambush';
  lead.inBattle=1;
  B={foes:[],draw:freshBattleDraw(),disc:[],hand:[],
     thr:-1,chain:0,nextMul:1,block:0,best:0,over:false,waves:1,target:0,
     open:kind, skipEnemy:isPre?1:0, firstTurn:true,
     pendingLoot:0,lootGold:0,lootXp:0,lootKills:0,levelsGained:0,lootAbsorbing:false,lootCollected:false,
     victoryQueued:false,victoryFinalizing:false,

     cur:[], bestArr:[], chains:[], ults:{}};
  PARTY.forEach(m=>m.used=false);
  S.deck.forEach(o=>{ delete o._dealt; });   // 每場戰鬥手牌都重新從下方滑出
  deploySquad(lead,false);
  $('flashFx').classList.remove('go');void $('flashFx').offsetWidth;$('flashFx').classList.add('go');
  fbPush({inBattle:1});
  $('dungeon').classList.add('hide');

  bt.classList.remove('hide');bt.classList.remove('enter');void bt.offsetWidth;bt.classList.add('enter');
  $('veil').classList.add('hide');
  drawFieldBg();
  if(kind!=='normal') setTimeout(()=>showOpenBanner(kind),380);
  toast('敵隊展開：'+lead.n+' ×'+lead.roster.length,1500);

  const bossFoe=B.foes.find(f=>f.boss);
  const begin=()=>{
    newTurn();
    applyFollowerSupport();
    const speaker=B.foes.find(f=>!f.dead);
    if(speaker)setTimeout(()=>monsterSay(speaker,'start',true),520);
    if(kind==='back') setTimeout(enemyStrike,900);
    startReinforceClock();
  };
  if(bossFoe) bossNpcBriefing(bossFoe,()=>bossCutscene(bossFoe,begin)); else begin();
}
/* 隊伍展開：把一格上的隊伍拆成一個個組員排進陣型 */
function deploySquad(m,animate){
  m.roster.forEach((kind,i)=>{
    if(B.foes.filter(f=>!f.dead).length>=MAX_FOES)return;
    const base=FOES[kind];
    const fr=[[1,4],[1,3],[2,5]][rand(3)];
    const eliteMul=m.elite?1.35:1;
    const bh=Math.max(8,Math.round(base.hp*DIFFS[diff].hp*eliteMul));
    const f={...base,kind,squad:m.id,max:bh,hp:bh,atk:Math.round(base.atk*(m.elite?1.18:1)),burn:0,dead:false,shield:0,act:'atk',
      expr:hpExpr(bh,fl),
      fracNum:fr[0],fracDen:fr[1],
      fresh:true,delay:i*110,uid:'f'+m.id+'_'+i,row:0,intent:0};
    insertFoe(f,animate);
  });
}

/* 陣型核心：前排滿了排後排；同排內隨機往左端或右端插入 */
function insertFoe(f,animate=true){
  f.fresh=animate;
  const frontN=B.foes.filter(x=>!x.dead&&x.row===0).length;
  f.row = (f.boss||frontN<FRONT_CAP) ? 0 : 1;
  f.intent=rollIntent(f);
  if(f.boss){ f.eyes=5+rand(4); f.open=0; }   // 5~8 顆眼睛（模擬調校）
  if(Math.random()<.5) B.foes.unshift(f); else B.foes.push(f);
}

 regen:'防禦時同時回復 HP',venom:'攻擊有 30% 機率混入詛咒牌',chorus:'鼓舞時讓全體怪物提高攻擊',
 chaos:'每回合在猛烈與保守攻擊間變化',
};
function rollIntent(f){
  const r=Math.random();
  const t=f.battleType||'';
  if((t==='ward'||t==='regen')&&r<.28){f.act='def';f.intent=Math.round((8+rand(8))*(t==='ward'?1.3:1));}
  else if(t==='hex'&&r<.28&&!f.boss){f.act='curse';f.intent=0;}
  else if((t==='fury'||t==='chorus')&&r<.26){f.act='buff';f.intent=3;}
  else if(r<0.10){ f.act='def'; f.intent=8+rand(8); }
  else if(r<0.15){ f.act='buff'; f.intent=3; }
  else if(r<0.20 && !f.boss){ f.act='curse'; f.intent=0; }
  else {
    let mul=t==='swift'?1.18:t==='chaos'?(.78+Math.random()*.62):1;
    mul*=1-(B&&B.followerWeaken||0);
    f.act='atk'; f.intent=Math.max(2,Math.round((f.atk+rand(4))*enemyAttackScale()*(f.row?.72:1)*mul));
  }
  return f.intent;
}

function foeScale(n,idx){
  const base=clamp(1.18-(n-1)*.078,.54,1.18);

}
function layoutFoes(){
  const field=$('field'),W=field.clientWidth,H=field.clientHeight;
  for(const row of [0,1]){
    const line=B.foes.filter(f=>!f.dead&&f.row===row);
    const n=line.length;
    if(!n)continue;
    const gap=Math.min(row?96:112,(W-40)/Math.max(1,n));
    line.forEach((f,i)=>{
      const el=document.getElementById(f.uid);
      if(!el)return;
      const sc=foeScale(n,i)*(f.boss?1.55:1)*(row?.74:1);   // 後排再縮小
      const w=Math.round(92*sc);
      const off=i-(n-1)/2;
      const x=W/2+off*gap-w/2+(row?gap*.32:0);              // 後排錯開，不被前排完全擋住
      const depth=Math.abs(off);
      const y=(row?H*0.24:H*0.46)-w*0.5+depth*(row?4:7);
      el.style.width=w+'px';
    el.style.setProperty('--r',Math.round(w*0.55)+'px');
      el.style.left=Math.round(x)+'px';
      el.style.top=Math.round(y)+'px';
      el.style.zIndex=String((row?6:20)-Math.round(depth*2));
    });
  }
  const cur=document.querySelector('.cursor');
  if(cur)cur.remove();
  const t=B.foes[B.target];

/* 把一次傷害拆成 n 段，總和保證等於原值 */
function splitDamage(total,chain,hits){
  if(total<=0) return [total];
  let n = 1 + (hits-1) + Math.floor((chain||1)/3);
  n = Math.max(1, Math.min(8, n));
  if(total<n) n=Math.max(1,total);        // 傷害太小就不要硬拆
  const base=Math.floor(total/n), rem=total-base*n;
  const out=[];
  for(let i=0;i<n;i++) out.push(base+(i<rem?1:0));
  return out;
}

function newTurn(){

/* 被偷襲：敵人在你出牌前先打一輪 */

// 出牌規則：只要法力夠，任何牌都能打
// 但只有費用剛好等於「目前序列值」的牌（或通用卡✦）才會【接續連擊】
// 打出其他費用的牌 → 連擊【重新計算】，序列跳到該牌費用+1
const chainable=o=>{const c=effCard(o);return c.wild||c.neg||c.c===B.step;};
/* 完成 3 連後才進入節奏折扣：第 4 張起，接續的一般牌最多消耗 1 法力。 */
const previewManaCost=o=>{const c=effCard(o);return B.chain>=3&&chainable(o)&&!c.wild&&!c.neg?Math.min(1,c.c):c.c;};
const legal=o=>previewManaCost(o)<=B.mana;
/* 數列推進：固定公差 +1 —— 全場統一 0→1→2→3，規則只有一條，好記也好教 */
function nextStep(cost){ return cost+1; }
const seqStart=()=>0;
const isPrime=n=>n===2||n===3;
/* 前五連有明顯成長，之後改為遞減收益並封頂，避免長連一張秒殺整場。 */
const chainMul=()=>{
  const n=Math.max(0,B.chain-1),step=Math.max(.2,Math.min(.45,Number(S.step)||.35));
  return Math.min(3.25,1+Math.min(4,n)*step+Math.max(0,n-4)*step*.35);
};

function playCard(i){
  if(!B||B.over||B.busy)return;
  const o=B.hand[i];
  if(!o)return;
  if(DUEL&&DUEL.waiting){ toast('現在是對方的回合',1200); return; }
  if(!legal(o))return;
  try{ _playCard(i); }catch(err){ console.error("playCard 發生錯誤",err); toast("出牌失敗，請回報",1400); }
}
function _playCard(i){

  const cont=chainable(o);

  B.lastCosts=(B.lastCosts||[]).concat(c.c);
  B.hand.splice(i,1);
  if(cont){ B.chain++; B.cur.push(c.c); }
  else {
    if(B.cur.length>B.bestArr.length) B.bestArr=B.cur.slice();

  const big=B.nextMul>1||luckMul>1;

    }

    if(c.sp==='fermat'){

        if(t.hp<=0){t.hp=0;t.dead=true;} }
    }
    if(c.sp==='pascal'){ const n=Math.min(3,Math.max(1,B.chain)); drawCards(n);
      toast('帕斯卡三角：抽 '+n+' 張',1400); }
    if(c.sp==='archi'&&tgt){
      const sh=tgt.shield||0; tgt.shield=0;
      const d=Math.round((sh+12)*mul);
      tgt.hp-=d;popDmg(tgt,d,sh>0,'⚖ ');
      if(sh)toast('槓桿原理：'+sh+' 點護盾反轉為傷害',1600);
      if(tgt.hp<=0){tgt.hp=0;tgt.dead=true;}

  const fxHits=[];
  if(c.dmg){
    const alive=B.foes.filter(f=>!f.dead);

    let tot=0;

      const rowCut=t.row===1?.6:1;          // 後排距離遠，全體傷害衰減
      // 質數剋星：只有質數費用的卡打得痛
      const primeCut = B.trait==='prime' ? (isPrime(c.c)?1.5:0.6) : 1;
      // BOSS 鎧甲：五連前大幅減傷；達五連後破甲，鼓勵用完整連段取勝。

      const areaCut=c.all?.68:1;              // 全體卡以範圍換取威力，避免全面勝過單體卡

      const fracCut = 1;
      let sub=0;

        let d=Math.max(1,Math.round(c.dmg*mul*rowCut*primeCut*fracCut*bossChainCut*areaCut));
        if(t.shield){ const ab=Math.min(t.shield,d); t.shield-=ab; d-=ab; }
        t.hp-=d;tot+=d;sub+=d;
        if(t.hp<=0){t.hp=0;t.dead=true;}
      }
      fxHits.push({uid:t.uid,d:sub,crit:big||B.chain>=8,pre:(c.hits>1)?(c.hits+'× '):''});
    }
    if(tot){ creditDamage(tot); if(DUEL&&!DUEL.done) DUEL.myDmg+=tot; }
    if(c.drain){const dr=Math.min(Math.round(tot*.12),S.maxhp-S.hp);S.hp+=dr;
      if(dr)popPlayer('+'+dr+' ♥','heal',120);}
  }
  /* 護盾只吃小幅連擊加成，不吃角色攻擊倍率或傷害詞條，避免高攻角色同時變成無敵坦克。 */
  const shieldChainMul=Math.min(1.35,1+Math.max(0,B.chain-1)*.05);
  if(c.block)gainPlayerBlock(Math.round(c.block*shieldChainMul),0);
  if(c.heal){const hl=Math.min(c.heal,S.maxhp-S.hp);S.hp+=hl;if(hl)popPlayer('+'+hl+' ♥','heal',80);}
  if(c.burn){const t=targetFoe();if(t)t.burn+=c.burn;}
  if(c.manaUp){                       // 僅限本場戰鬥
    B.manaBonus=(B.manaBonus||0)+c.manaUp;
    B.mana+=c.manaUp;
    toast('本場法力上限 +'+c.manaUp+'（目前 '+(S.mana+B.manaBonus)+'）',1800);
  }
  if(c.capUp){const up=addBattleHandLimit(c.capUp);toast(up?'本場手牌上限 +'+up+'（最高 '+MAX_BATTLE_HAND_LIMIT+'）':'手牌上限已達 '+MAX_BATTLE_HAND_LIMIT,1400);}
  if(c.mul)B.nextMul=c.mul;

  if(B.mana>manaCap) B.mana=manaCap;
  if(c.manaGain){

    const actual=B.mana-before;toast((c.wild?'通用卡回魔：+':'補償法力：+')+actual+' 點'+(actual<mg?'（已達儲存上限）':''),1300);

    B.rareSpark=true;
    const before=B.mana;B.mana=Math.min(manaCap,B.mana+1);
    gainPlayerBlock(3,0);
    toast('🔷 稀有能力「精準文具」：返還 '+(B.mana-before)+' 法力、護盾 +3',1700);
  }
  if(c.r==='L'&&!B.legendSpark){
    B.legendSpark=true;
    const before=B.mana;B.mana=Math.min(manaCap,B.mana+2);drawCards(1);
    toast('🌟 傳說能力「靈感突破」：返還 '+(B.mana-before)+' 法力、抽 1 張',1900);
    cineCard(o,Math.max(5,B.chain));
  }
  // 通用卡與負費卡：不改變序列進度（但仍增加連擊數），一般卡才推進序列。
  B.step = (c.wild||c.neg) ? B.step : nextStep(c.c);
  // 負費卡的代價
  if(c.neg){
    if(c.selfDmg){ S.hp=Math.max(1,S.hp-c.selfDmg); popPlayer('-'+c.selfDmg,'hurt',80); flash(); }
    if(c.addCurse){ B.disc.push({id:'curse',gem:null}); toast('一張詛咒混入牌堆',1300); }
    if(c.foeShield){ const t=targetFoe(); if(t){ t.shield=(t.shield||0)+c.foeShield;
      popDmg(t,c.foeShield,false,'🛡 +'); } }
    if(c.dmgDown){ B.dmgPenalty=c.dmgDown; toast('本回合傷害 −'+Math.round(c.dmgDown*100)+'%',1500); }
    if(c.addCurse||c.dmgDown)triggerFollowerSkills('assist',{status:c.addCurse?'curse':'weaken'});

  for(const f of B.foes){

  }
}
function endTurn(){
  if(B.over||B.busy)return;
  $('endBtn').classList.remove('urge');
  if(B.pvp&&B.pvp.practice){                 // 練習賽：AI 立刻回擊
    if(B.foes[0].hp<=0){ practiceEnd(true); return; }
    B.disc.push(...B.hand); B.hand=[];
    setTimeout(aiTakeTurn,450); return;
  }
  if(DUEL&&!DUEL.done){
    if(DUEL.waiting){ toast('等待對方出牌',1200); return; }
    B.disc.push(...B.hand); B.hand=[];
    duelSendTurn(); return;
  }
  // 灼燒結算
  for(const f of B.foes){
    if(f.dead||!f.burn)continue;
    const b=f.burn;
    f.hp-=b;f.burn=Math.max(0,f.burn-2);
    popDmg(f,b,false,'🔥');
    if(f.hp<=0){f.hp=0;f.dead=true;}
  }
  if(B.foes.every(f=>f.dead)){renderAll();queueBattleVictory();return;}
  advanceRows();
  if(B.skipEnemy>0){                       // 先制：敵人這回合來不及反應
    B.skipEnemy--;
    toast('先制中 — 敵人無法行動',1200);
    finishEnemyPhase();
  }else{
    enemyPhase(0,finishEnemyPhase);
  }
}
/* 敵人逐一出手，每一擊都跳出扣盾／扣血數值 */
function enemyPhase(i,done){
  if(!B||B.over)return;
  const alive=B.foes.filter(f=>!f.dead);
  if(i>=alive.length){done&&done();return;}
  B.busy=true;
  const f=alive[i];
  if(f.frozen>0){
    f.frozen--;popDmg(f,0,false,'❄ 凍結');toast('❄️ '+f.n+' 被凍結，無法行動',1100);
    setTimeout(()=>enemyPhase(i+1,done),360);return;
  }
  if(f.boss){ setTimeout(()=>enemyPhase(i+1,done),60); return; }   // Boss 只靠眼睛攻擊
  const el=document.getElementById(f.uid);
  if(el){el.classList.add('acting');el.classList.remove('attack');
         void el.offsetWidth;el.classList.add('attack');}
  monsterSay(f,f.hp/f.max<=.3?'low':(f.act||'atk'));
  const usedSpeciesFx=monsterAbilityFx(f);
  if(!usedSpeciesFx&&(f.act==='atk'||f.act==='curse'))monsterFullFx(f,f.act==='curse'?'情緒迷霧':'勇敢出手');
  if(f.act==='def'){                       // 上盾：自己獲得護盾
    f.shield=(f.shield||0)+f.intent;
    let regen=0;if(f.battleType==='regen'&&f.hp<f.max){regen=Math.min(6,f.max-f.hp);f.hp+=regen;}
    setTimeout(()=>{ popDmg(f,f.intent,false,'🛡 +'); refreshStatus();
      if(regen)toast('🌿 '+f.n+' 再生 HP +'+regen,1000);
      setTimeout(()=>enemyPhase(i+1,done),320); },170);
    if(el)setTimeout(()=>el.classList.remove('acting'),400);
    return;
  }
  if(f.act==='buff'){                      // 強化：永久提升攻擊力
    if(f.battleType==='chorus')B.foes.filter(x=>!x.dead).forEach(x=>x.atk+=1);else f.atk+=3;
    triggerFollowerSkills('assist',{status:'enemyBuff'});
    setTimeout(()=>{ popDmg(f,3,true,'▲ ATK+'); refreshStatus();
      setTimeout(()=>enemyPhase(i+1,done),320); },170);
    if(el)setTimeout(()=>el.classList.remove('acting'),400);
    return;
  }
  if(f.act==='curse'){                     // 詛咒：塞一張廢牌進棄牌堆
    B.disc.push({id:'curse',gem:null});
    triggerFollowerSkills('assist',{status:'curse'});
    setTimeout(()=>{ toast(f.n+' 施放詛咒 — 一張詛咒牌混入牌堆',1500);
      refreshStatus(); setTimeout(()=>enemyPhase(i+1,done),320); },170);
    if(el)setTimeout(()=>el.classList.remove('acting'),400);
    return;
  }
  /* 固定防禦最多抵銷單次攻擊 35%，避免高等角色把低中階怪物全部壓成 1 傷害。 */
  const armorCut=Math.min(Math.max(0,Number(S.armor)||0),Math.floor(f.intent*.35));
  let raw=Math.max(1,f.intent-armorCut), absorbed=0, toHp=0;
  if(B.trait==='abs'){                       // 絕對值：反彈 |攻擊 − 護盾|，無視護盾
    raw=Math.abs(f.intent-B.block);
    toHp=Math.max(0,raw);
  }else{
    // 小怪攻擊帶少量穿透，避免護盾把整場所有攻擊都顯示成 0。
    const pierceRate=f.battleType==='breaker'?.30:.15;
    const pierce=(!B.pvp&&!DUEL)?Math.min(raw,Math.max(1,Math.round(raw*pierceRate))):0;
    const shieldable=Math.max(0,raw-pierce);
    absorbed=Math.min(B.block,shieldable);
    toHp=pierce+(shieldable-absorbed);
  }
  setTimeout(()=>{
    if(!B||B.over)return;
    if(absorbed){B.block-=absorbed;popPlayer('🛡 -'+absorbed,'shield',0);}
    if(toHp){
      S.hp-=toHp;
      popPlayer('-'+toHp,'hurt',absorbed?150:0);flash();
      if(f.battleType==='leech'&&f.hp<f.max){const heal=Math.min(5,Math.ceil(toHp*.25),f.max-f.hp);f.hp+=heal;if(heal)popDmg(f,heal,false,'💚 +');}
      if(f.battleType==='venom'&&Math.random()<.30){B.disc.push({id:'curse',gem:null});toast('🟣 '+f.n+' 的干擾毒粉混入一張詛咒牌',1200);triggerFollowerSkills('assist',{status:'venom'});}
      if(S.hp>0){triggerFollowerSkills('defense',{damage:toHp});triggerFollowerSkills('recovery',{damage:toHp});}
    }
    if(el)el.classList.remove('acting');

function collectGroundOrb(id,kind,target,delay){

function spawnKillLoot(f){
  if(!B||B.pvp||DUEL||f.lootDropped)return false;f.lootDropped=true;B.pendingLoot=(B.pendingLoot||0)+1;
  const el=document.getElementById(f.uid),r=el?el.getBoundingClientRect():$('field').getBoundingClientRect();
  const start={x:r.left+r.width/2,y:r.top+r.height*.42,groundY:r.bottom-13},value=killLootValue(f);

function absorbAllGroundLoot(done){
  if(!B||B.lootCollected){done&&done();return;}
  if(B.lootAbsorbing)return;
  B.lootAbsorbing=true;
  const drops=(B.foes||[]).filter(f=>f.lootDropped&&!f.lootAbsorbed);
  let gold=0,xp=0,kills=0,nodes=[];
  for(const f of drops){
    const v=f.lootValue||killLootValue(f);f.lootAbsorbed=true;gold+=v.gold;xp+=v.xp;kills++;
    nodes=nodes.concat(f.lootNodes||[]);

        mg.strokeStyle='#8fe86a'; mg.lineWidth=2.5;
        mg.beginPath(); mg.moveTo(bx,by);
        mg.lineTo(bx+ux*s*1.6, by+uy*s*1.6); mg.stroke();
        const tx=bx+ux*s*2.2, ty=by+uy*s*2.2;
        mg.fillStyle='#8fe86a'; mg.beginPath();
        mg.moveTo(tx,ty);
        mg.lineTo(tx-ux*s*.8-uy*s*.45, ty-uy*s*.8+ux*s*.45);
        mg.lineTo(tx-ux*s*.8+uy*s*.45, ty-uy*s*.8-ux*s*.45);
        mg.closePath(); mg.fill(); mg.restore();
      }
    }
  }
  // 陷阱不顯示在小地圖 —— 踩到才會發現
  for(const r of rivals){
    if(!r.alive||!seen[r.y][r.x])continue;
    mg.fillStyle=r.a.col;
    mg.fillRect(r.x*s+s*.15,r.y*s+s*.15,s*.7,s*.7);
    if(r.fled){                            // 躲過的對手用紅框標示：再遇到就得打
      mg.strokeStyle='#ff3b3b'; mg.lineWidth=2;
      mg.strokeRect(r.x*s+s*.08,r.y*s+s*.08,s*.84,s*.84);
    }
    if(r.chasing>0){ mg.strokeStyle='#fff'; mg.lineWidth=1.5;
      mg.strokeRect(r.x*s+s*.1,r.y*s+s*.1,s*.8,s*.8); }
  }
  for(const o of otherList()){
    const J=JOBS[o.job]||JOBS.geo;
    mg.fillStyle=J.col;
    mg.fillRect((o.x+.5)*s-s*.22,(o.y+.5)*s-s*.22,s*.44,s*.44);
  }
  for(const m of mobs){
    if(!m.alive||!seen[m.y][m.x])continue;
    mg.fillStyle=m.state==='alert'?'#ff3b3b':m.boss?'#ff8a3b':'#e05a5a';
    mg.fillRect(m.x*s+s*.2,m.y*s+s*.2,s*.6,s*.6);
  }
  mg.fillStyle='#8fd455';
  mg.beginPath();mg.arc((P.ax+.5)*s,(P.ay+.5)*s,s*.32,0,7);mg.fill();
  mg.strokeStyle='#8fd455';mg.lineWidth=2;mg.beginPath();
  mg.moveTo((P.ax+.5)*s,(P.ay+.5)*s);
  mg.lineTo((P.ax+.5+Math.sin(P.aang))*s,(P.ay+.5-Math.cos(P.aang))*s);mg.stroke();
}

function drawBigMap(){
  if(!bmg)return;
  const W=bmCv.width,H=bmCv.height;
  const s=Math.floor(Math.min(W/MW,H/MH));
  const ox=(W-s*MW)>>1,oy=(H-s*MH)>>1;
  bmg.imageSmoothingEnabled=false;
  bmg.fillStyle='#0b0718';bmg.fillRect(0,0,W,H);
  const eT=Math.max(2,s*.22),eB=Math.max(2,s*.16);
  const MT=CUR_TH.mini;
  let seenFloor=0,totFloor=0;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const c=grid[y][x];
    if(c!=='W'){totFloor++;if(seen[y][x])seenFloor++;}
    if(!seen[y][x])continue;
    const X=ox+x*s,Y=oy+y*s;
    if(c==='W'){
      bmg.fillStyle=MT.wall;bmg.fillRect(X,Y,s,s);
      bmg.fillStyle=MT.hi;bmg.fillRect(X,Y,s,eT);
      bmg.fillStyle=MT.lo;bmg.fillRect(X,Y+s-eB,s,eB);
    }else if(c==='L'){
      bmg.fillStyle='#ecc24e';bmg.fillRect(X,Y,s,s);
      bmg.fillStyle='#fff0b0';bmg.fillRect(X,Y,s,eT);
      // 鎖孔記號：還沒拿鑰匙的門一眼認出
      if(!S.key){bmg.fillStyle='#3a2708';
        bmg.fillRect(X+s*.42,Y+s*.28,s*.16,s*.16);
        bmg.fillRect(X+s*.46,Y+s*.4,s*.08,s*.3);}
    }else{
      bmg.fillStyle=((x+y)&1)?MT.fA:MT.fB;bmg.fillRect(X,Y,s,s);
      bmg.fillStyle='rgba(0,0,0,.12)';bmg.fillRect(X,Y+s-1,s,1);
    }
  }
  // 怪物警戒視野
  for(const m of mobs){
    if(!m.alive||!seen[m.y]||!seen[m.y][m.x])continue;
    bmg.fillStyle=m.state==='alert'?'rgba(255,60,60,.22)':'rgba(255,200,80,.14)';
    for(const [tx,ty] of coneTiles(m))bmg.fillRect(ox+tx*s,oy+ty*s,s,s);
  }
  // 道具／NPC：直接用遊戲內精靈圖，比色塊更好認
  for(const p of props){
    if(!p.alive||!seen[p.y]||!seen[p.y][p.x])continue;
    const kind=p.t==='npc'?'npc_'+p.k:p.t;
    try{
      const sp=artOf('p',kind,0).lv[0];
      bmg.drawImage(sp,ox+p.x*s+s*.08,oy+p.y*s+s*.08,s*.84,s*.84);
    }catch(_){
      bmg.fillStyle='#c98a3c';bmg.fillRect(ox+p.x*s+s*.25,oy+p.y*s+s*.25,s*.5,s*.5);
    }
  }
  // 對手（AI 同學）
  for(const r of rivals){
    if(!r.alive||!seen[r.y]||!seen[r.y][r.x])continue;
    try{
      const sp=artOf('p','rival_'+r.k,r.chasing>0).lv[0];
      bmg.drawImage(sp,ox+r.x*s+s*.08,oy+r.y*s+s*.08,s*.84,s*.84);
    }catch(_){
      bmg.fillStyle=r.a.col;bmg.fillRect(ox+r.x*s+s*.15,oy+r.y*s+s*.15,s*.7,s*.7);
    }
    if(r.fled){bmg.strokeStyle='#ff3b3b';bmg.lineWidth=2;
      bmg.strokeRect(ox+r.x*s+1,oy+r.y*s+1,s-2,s-2);}
  }
  // 連線中的其他玩家
  for(const o of otherList()){
    const J=JOBS[o.job]||JOBS.geo;
    bmg.fillStyle=J.col;
    bmg.beginPath();bmg.arc(ox+(o.x+.5)*s,oy+(o.y+.5)*s,s*.24,0,7);bmg.fill();
  }
  // 怪物
  for(const m of mobs){
    if(!m.alive||!seen[m.y]||!seen[m.y][m.x])continue;
    try{
      const sp=artOf('mob',m.art,m.state==='alert').lv[0];
      bmg.drawImage(sp,ox+m.x*s+s*.06,oy+m.y*s+s*.06,s*.88,s*.88);
    }catch(_){
      bmg.fillStyle=m.state==='alert'?'#ff3b3b':'#e05a5a';
      bmg.fillRect(ox+m.x*s+s*.2,oy+m.y*s+s*.2,s*.6,s*.6);
    }
    if(m.boss){bmg.strokeStyle='#ff8a3b';bmg.lineWidth=2;
      bmg.strokeRect(ox+m.x*s+1,oy+m.y*s+1,s-2,s-2);}
  }
  // 拿到鑰匙後指向樓梯／出口
  if(S.key){
    const ex=props.find(o=>o.alive&&(o.t==='stair'||o.t==='exit'));
    if(ex){
      const dx=ex.x-P.x,dy=ex.y-P.y,d=Math.hypot(dx,dy);
      if(d>0.5){
        const ux=dx/d,uy=dy/d,bx=ox+(P.x+.5)*s,by=oy+(P.y+.5)*s;
        bmg.save();bmg.globalAlpha=.85;bmg.strokeStyle='#8fe86a';bmg.lineWidth=3;
        bmg.setLineDash([s*.4,s*.3]);
        bmg.beginPath();bmg.moveTo(bx,by);
        bmg.lineTo(ox+(ex.x+.5)*s,oy+(ex.y+.5)*s);bmg.stroke();bmg.restore();
      }
    }
  }
  // 玩家：視野扇形＋方向箭頭
  const pxx=ox+(P.ax+.5)*s,pyy=oy+(P.ay+.5)*s;
  bmg.save();
  bmg.translate(pxx,pyy);bmg.rotate(P.aang-Math.PI/2);
  bmg.fillStyle='rgba(255,227,138,.12)';
  bmg.beginPath();bmg.moveTo(0,0);bmg.arc(0,0,s*3.4,-.5,.5);bmg.closePath();bmg.fill();
  bmg.fillStyle='#8fd455';bmg.strokeStyle='#07050f';bmg.lineWidth=2;
  bmg.beginPath();
  bmg.moveTo(s*.42,0);bmg.lineTo(-s*.3,-s*.3);bmg.lineTo(-s*.14,0);bmg.lineTo(-s*.3,s*.3);
  bmg.closePath();bmg.fill();bmg.stroke();
  bmg.restore();
  $('bigMapPct').textContent='探索 '+Math.round(seenFloor/Math.max(1,totFloor)*100)+'%　'+$('floorTag').textContent;
}

/* resetRun：只重置輪迴狀態（血量一律補滿），不負責進場 ——
   讓「校園地圖選區進場」也能套用，走輪迴殿堂繞路血量照樣是滿的 */
function resetRun(){
  const keepName=S.name, keepJob=S.job;
  // meta（知識點／傳承／圖鑑／收集）必須跨輪迴保留，不能被 Object.assign 洗掉
  const keepMeta=S.meta||{souls:0,runs:0,totalQ:0,totalOk:0,perks:{}};
  const keepCleared=(S.cleared===undefined?-1:S.cleared);
  const keepBest=S.zoneBest||{};
  const keepProgress=S.zoneProgress||{};
  const keepExt=S.extAbil||{};
  Object.assign(S,{hp:100,maxhp:100,lv:1,xp:0,xpNeed:3,
    deck:mkDeck(['knife','knife','dagger','blank','clock','wand','wand','garlic','whip','imelda']),
    gems:[],dmgMul:1,step:.35,handSize:5,armor:0,key:false,mana:6,tomes:0,handCap:5,chant:false,allChains:[],gold:0,ups:{},name:'',job:'',pot:{heal:1,elixir:0,freeze:0,firebomb:0,luck:0,medkit:0},luckChest:0,shrineUses:{},wrong:[],found:[],zone:0,cleared:keepCleared,zoneBest:keepBest,zoneProgress:keepProgress,meta:keepMeta,extAbil:keepExt});
  quizStats={ok:0,total:0,points:0};
  if(keepJob&&JOBS[keepJob]){ S.name=keepName;S.job=keepJob;S.deck=mkDeck(JOBS[keepJob].deck);
    S.handSize=5; }
  // ── 輪迴傳承：只有【玩家選定的傳說卡】跟著下一輪，其餘歸回起始牌組 ──
  //    （全帶反而會稀釋費用曲線，所以設可攜上限並讓玩家自選）
  const owned=((S.meta&&S.meta.legendary)||[]).filter(id=>CARDS[id]);
  const cap=legacyCap();
  let picked=((S.meta&&S.meta.legacyPick)||[]).filter(id=>owned.includes(id)).slice(0,cap);
  if(!picked.length&&owned.length){                 // 沒選過就自動挑低費的
    picked=owned.slice().sort((a,b)=>(CARDS[a].wild?0:CARDS[a].c)-(CARDS[b].wild?0:CARDS[b].c)).slice(0,cap);
  }
  for(const id of picked) S.deck.push({id,gem:null});
  // 等級歸 1 → 生命與魔力回到起點，再套用輪迴永久強化
  S.lv=1; S.xp=0; S.xpNeed=3; S.maxhp=100; S.mana=6;
  // 套用輪迴的永久強化
  S.maxhp+=metaVal('vit');
  S.armor+=metaVal('purse');
  S.pot.heal=(S.pot.heal||0)+metaVal('flask');
  S.dmgMul+=metaVal('sharp');
  /* 通用之識改為增強回魔，不再增加通用卡張數；全牌組上限固定 2 張。 */
  // 外部匯入角色的加成也要納入，最後才補滿血
  if(S.extAbil&&S.extAbil.maxhp) S.maxhp+=S.extAbil.maxhp;
  S.hp=S.maxhp;                    // ← 一律以最終上限補滿
  S.deck=sanitizeDeck(S.deck,S.job);
  saveChar();
}
function reset(){

        <div class="rvi" style="background:#4a3b7333;color:#cbbde8">${k==='easy'?'🌱':k==='hard'?'🔥':'⚖'}</div>
        <div class="rvinfo"><div class="rvn">${DIFFS[k].n}${diff===k?'　✓ 目前':''}</div>
        <div class="rvd">敵人血量 ×${DIFFS[k].hp}　攻擊 ×${DIFFS[k].atk}　援軍每 ${(DIFFS[k].ms/1000).toFixed(1)} 秒推進</div>
        </div></div>`).join('')}</div>
    <button class="go" id="ok">返回</button>`,menuScreen,el=>{
      const row=el.closest('.rvrow'); if(!row)return false;
      diff=row.dataset.d; saveChar();
      setTimeout(menuScreen,10); return true;
    });
}
function volScreen(){
  const opts=['auto',1,2,3,4,5,6];
  overlay(`<div class="kicker">SETTING</div><h1>出題範圍</h1>
    <div class="desc" style="margin-bottom:8px">
      「依樓層」會按你所在區域自動選冊；也可以鎖定某一冊集中練習。</div>
    <div id="rvlist">${opts.map(v=>
      `<div class="rvrow${volPick===v?' on':''}" data-v="${v}">
        <div class="rvi" style="background:#4a3b7333;color:#cbbde8">${v==='auto'?'⟳':v}</div>
        <div class="rvinfo"><div class="rvn">${v==='auto'?'依樓層自動':'第 '+v+' 冊'}${volPick===v?'　✓ 目前':''}</div>
        </div></div>`).join('')}</div>
    <button class="go" id="ok">返回</button>`,menuScreen,el=>{
      const row=el.closest('.rvrow'); if(!row)return false;
      const v=row.dataset.v;
      volPick=(v==='auto')?'auto':+v; saveChar();
      setTimeout(menuScreen,10); return true;
    });
}
loadChar();
classroomApplyLaunch();
if(grantTestMonsterTeam())saveChar();
loadCampus();
syncZones();
if(!startDungeonHealthGuard())introScreen();
</script>
</body>
</html>
